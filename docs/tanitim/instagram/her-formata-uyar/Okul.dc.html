<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Okul kupası</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@1,800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F172A; color: #F8FAFC; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; gap: 36px; padding: 84px 88px">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 520px; background: linear-gradient(180deg, #0B2A5B 0%, rgba(15,23,42,0) 100%)"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: 4px; color: #60A5FA">OKUL TURNUVASI</div>
    <div style="font-size: 24px; font-weight: 600; color: #94A3B8">3 / 5</div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 22px">
    <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 118px; line-height: 0.9">DEFTER YOK,<br>PUAN DURUMU VAR.</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 12px">
      <span style="padding: 10px 22px; border-radius: 40px; background: #60A5FA; color: #0B2447; font-size: 28px; font-weight: 700">7 + 3 yedek</span>
      <span style="padding: 10px 22px; border-radius: 40px; background: #1E293B; border: 2px solid #334155; font-size: 28px; font-weight: 700">2×20 dk</span>
      <span style="padding: 10px 22px; border-radius: 40px; background: #1E293B; border: 2px solid #334155; font-size: 28px; font-weight: 700">Tek grup, 6 okul</span>
      <span style="padding: 10px 22px; border-radius: 40px; background: #1E293B; border: 2px solid #334155; font-size: 28px; font-weight: 700">Fikstür kurası</span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; padding: 22px 34px; border-radius: 32px; background: #1E293B; border: 2px solid #334155">
    <div style="display: grid; grid-template-columns: 44px 1fr 56px 56px 56px 56px 72px 72px; align-items: center; height: 54px; font-size: 22px; font-weight: 700; color: #94A3B8">
      <span>#</span><span>A Grubu</span><span style="text-align: center">O</span><span style="text-align: center">G</span><span style="text-align: center">B</span><span style="text-align: center">M</span><span style="text-align: center">AV</span><span style="text-align: center">P</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 44px 1fr 56px 56px 56px 56px 72px 72px; align-items: center; height: 76px; border-top: 2px solid #334155; font-size: 27px; font-weight: 600">
        <span style="color: #94A3B8">{{r.pos}}</span>
        <span style="display: flex; align-items: center; gap: 16px; min-width: 0"><img src="{{r.logo}}" alt="{{r.alt}}" style="width: 54px; height: 54px; flex-shrink: 0"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span></span>
        <span style="text-align: center; color: #CBD5E1">{{r.o}}</span>
        <span style="text-align: center; color: #CBD5E1">{{r.g}}</span>
        <span style="text-align: center; color: #CBD5E1">{{r.b}}</span>
        <span style="text-align: center; color: #CBD5E1">{{r.m}}</span>
        <span style="text-align: center; color: #CBD5E1">{{r.av}}</span>
        <span style="text-align: center; font-weight: 800; color: #60A5FA">{{r.p}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (pos, name, logo, o, g, b, m, av, p) => ({ pos, name, logo, alt: name + ' arması', o, g, b, m, av, p });
    return {
      rows: [
        t(1, 'Deniz Anadolu Lisesi', '/_blob/074be9289e2e77c4434d4eb1176c0b41', 2, 1, 1, 0, '+1', 4),
        t(2, 'Bilim Ortaokulu', '/_blob/e20a5b472da172888a929af71383ce0f', 2, 1, 1, 0, '+1', 4),
        t(3, 'Ufuk Ortaokulu', '/_blob/1f84feb6f0f9d97b0d9c230a16500766', 2, 1, 0, 1, '+3', 3),
        t(4, 'Çınar Koleji', '/_blob/49ec866837a89af9f52630e8cdb25eb0', 2, 1, 0, 1, '+1', 3),
        t(5, 'Yıldız Koleji', '/_blob/8e2e9fe936318248d396be48475b523d', 2, 1, 0, 1, '+1', 3),
        t(6, 'Gökkuşağı Koleji', '/_blob/2727374171efc068b942f45070844d05', 2, 0, 0, 2, '-7', 0)
      ]
    };
  }
}
</script>
</body>
</html>
