<title>Android İkon Zemini</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one row per background option, each showing three launcher mask shapes on a light and a dark wallpaper */
:root{
  --bg:#F3F5F2; --fg:#14211B; --muted:#5B6B63; --line:#D8DFDA; --card:#FFFFFF; --accent:#0B5D41; --gold:#C9A043;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1411;--fg:#E7EEEA;--muted:#93A39B;--line:#24322C;--card:#121D18;--accent:#4FC08F;--gold:#E2BE62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1411;--fg:#E7EEEA;--muted:#93A39B;--line:#24322C;--card:#121D18;--accent:#4FC08F;--gold:#E2BE62;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:var(--display);font-size:34px;letter-spacing:.01em;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);max-width:66ch;margin:0 0 24px}
.opts{display:grid;gap:16px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.opt.rec{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.head h2{font-family:var(--display);font-size:22px;margin:0}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.rec .tag{border-color:var(--gold);color:var(--gold)}
.note{color:var(--muted);margin:0;max-width:70ch}
.walls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.walls{grid-template-columns:1fr}}
.wall{border-radius:10px;padding:16px 10px 10px;display:flex;justify-content:space-around;gap:8px}
.wall.light{background:linear-gradient(135deg,#dfe9f3,#f6efe4)}
.wall.dark{background:linear-gradient(135deg,#1b2735,#0b0f14)}
.cell{display:grid;justify-items:center;gap:6px;font-size:11px}
.wall.light .cell{color:#3a4650}.wall.dark .cell{color:#c4ccd4}
.ico{width:64px;height:64px;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ico img{position:absolute;width:102%;height:102%;left:-1%;top:-1%;max-width:none}
.circle{border-radius:50%}.squircle{border-radius:32%}.rsquare{border-radius:18%}
</style>
<div class="wrap">
  <h1>Android ikon zemini</h1>
  <p class="lead">Arma aynı kalıyor, sadece Android'in ikonu kestiği şeklin köşelerinde kalan zemin rengi değişiyor. Her seçenek üç yaygın ikon şeklinde, açık ve koyu duvar kâğıdı üzerinde gösteriliyor. Uygulama içi logo, açılış ekranı ve web ikonları değişmiyor.</p>
  <div class="opts" id="opts"></div>
</div>
