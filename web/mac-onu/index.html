<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maç Önü Videosu · Lig Masası</title>
<style>
:root{--bg:#0a0d14;--card:#121725;--line:#232a3b;--text:#eef1f7;--muted:#8d97ab;--accent:#f07a22;--danger:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:460px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:-8px 0 0}
.screen{position:relative;width:100%;max-width:360px;align-self:center;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#05070c;box-shadow:0 0 0 1px var(--line)}
.screen canvas{width:100%;height:100%;display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{flex:1;min-width:130px;padding:13px 10px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:700 15px/1 inherit;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#140a02}
button:disabled{opacity:.5;cursor:default}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.msg{color:var(--muted);font-size:13px;min-height:20px}
.msg.err{color:var(--danger)}
</style>
</head>
<body>
<main>
  <h1 id="title">Maç Önü Videosu</h1>
  <p class="sub" id="sub">Yükleniyor…</p>
  <div class="screen"><canvas id="cv" width="1080" height="1920"></canvas></div>
  <div class="btns">
    <button id="preview" disabled>Önizle (sesli)</button>
    <button id="make" class="main" disabled>Videoyu oluştur</button>
  </div>
  <div class="bar" id="bar" hidden><i></i></div>
  <div class="btns" id="done" hidden>
    <button id="share" class="main">Paylaş</button>
    <button id="save">Kaydet</button>
  </div>
  <div class="msg" id="msg"></div>
</main>
<script src="/mac-onu/mp4-muxer.js"></script>
<script>
(function () {
  // Maç önü Reels videosu (1080x1920, 30 kare/sn, müzikli MP4).
  //   ?m=<maç id>                      → Karşı Karşıya (tek maç)
  //   ?l=<turnuva id>&d=<yyyy-mm-dd>   → Günün Maçları
  // Video tarayıcıda üretilir: kareler canvas'a çizilir, WebCodecs ile
  // H.264 + AAC kodlanır (desteklenmezse MediaRecorder ile gerçek zamanlı).
  var API = 'https://qxdjebzszikeslobrozf.supabase.co/rest/v1/';
  var KEY = '__SUPABASE_ANON_KEY__';
  var W = 1080, H = 1920, U = W / 100, FPS = 30;
  var ACCENT = '#f07a22';
  var DISPLAY = '"LM Display", "Arial Narrow", sans-serif';
  var BODY = '"LM Body", -apple-system, "Segoe UI", sans-serif';
  var MONTHS = ['OCAK', 'ŞUBAT', 'MART', 'NİSAN', 'MAYIS', 'HAZİRAN', 'TEMMUZ', 'AĞUSTOS', 'EYLÜL', 'EKİM', 'KASIM', 'ARALIK'];
  var DAYS = ['PAZAR', 'PAZARTESİ', 'SALI', 'ÇARŞAMBA', 'PERŞEMBE', 'CUMA', 'CUMARTESİ'];

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var scene = null, audioBuf = null, videoFile = null;

  function msg(t, err) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }
  function get(path) {
    return fetch(API + path, { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }).then(function (r) {
      if (!r.ok) throw new Error('Veri alınamadı (' + r.status + ')');
      return r.json();
    });
  }
  function inList(ids) { return '(' + ids.filter(Boolean).join(',') + ')'; }
  function upper(s) { return String(s || '').toLocaleUpperCase('tr-TR'); }
  // Afişlerle aynı kural (lib/core/utils/team_name.dart → posterTeamName):
  // 20 karakteri aşan adlarda "Master / Masterler / Masterlar" eki atılır.
  function posterName(raw) {
    var s = String(raw || '').trim();
    if (s.length <= 20) return s;
    var t = s.replace(/(^|[^\p{L}])master(?:ları|leri|lar|ler)?(?![\p{L}])/giu, '$1 ')
      .replace(/Spor Kulübü/gi, 'SK').replace(/Futbol Kulübü/gi, 'FK').replace(/\s+/g, ' ').trim();
    return t || s;
  }
  function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }
  function dateOf(d) { return d ? new Date(d + 'T12:00:00') : null; }
  function dayLine(d) { var x = dateOf(d); return x ? x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + DAYS[x.getDay()] : ''; }
  function slug(s) {
    return String(s || '').toLocaleLowerCase('tr-TR').replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u')
      .replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }
  function loadImg(src) {
    return new Promise(function (res) {
      if (!src) return res(null);
      var i = new Image(); i.crossOrigin = 'anonymous';
      i.onload = function () { res(i); }; i.onerror = function () { res(null); };
      i.src = src;
    });
  }
  function loadFonts() {
    var f = [
      new FontFace('LM Display', 'url(/assets/assets/fonts/BarlowCondensed-ExtraBold.ttf)', { weight: '800' }),
      new FontFace('LM Display', 'url(/assets/assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf)', { weight: '800', style: 'italic' }),
      new FontFace('LM Body', 'url(/assets/assets/fonts/Barlow-SemiBold.ttf)', { weight: '600' }),
      new FontFace('LM Body', 'url(/assets/assets/fonts/Barlow-Bold.ttf)', { weight: '700' })
    ];
    return Promise.all(f.map(function (x) { return x.load().then(function () { document.fonts.add(x); }, function () {}); }));
  }

  /* ---------------- Veri ---------------- */
  function weatherText(w) {
    if (!w || w.temp == null) return '';
    var d = String(w.description || '').trim();
    return Math.round(w.temp) + '°C' + (d ? ' · ' + d.charAt(0).toLocaleUpperCase('tr-TR') + d.slice(1) : '');
  }
  function enrich(matches, leagueId) {
    var teamIds = [], pitchIds = [];
    matches.forEach(function (m) { teamIds.push(m.home_team_id, m.away_team_id); if (m.pitch_id) pitchIds.push(m.pitch_id); });
    return Promise.all([
      get('teams?select=id,name,logo_url&id=in.' + inList(teamIds)),
      pitchIds.length ? get('pitches?select=id,name&id=in.' + inList(pitchIds)) : [],
      get('leagues?select=id,name,logo_url&id=eq.' + leagueId),
      get('match_weather?select=match_id,temp,description&match_id=in.' + inList(matches.map(function (m) { return m.id; })))
    ]).then(function (r) {
      var teams = {}, pitches = {}, weather = {};
      r[0].forEach(function (t) { teams[t.id] = t; });
      r[1].forEach(function (p) { pitches[p.id] = p.name; });
      r[3].forEach(function (w) { weather[w.match_id] = w; });
      var league = r[2][0] || { name: '' };
      var list = matches.map(function (m) {
        var h = teams[m.home_team_id] || {}, a = teams[m.away_team_id] || {};
        return {
          id: m.id, date: m.match_date, time: hhmm(m.match_time), week: m.week,
          round: m.cup_round || m.cup_name || '', live: !!m.youtube_url,
          home: { name: posterName(h.name), logoUrl: h.logo_url },
          away: { name: posterName(a.name), logoUrl: a.logo_url },
          pitch: pitches[m.pitch_id] || '', weather: weatherText(weather[m.id])
        };
      });
      var urls = [league.logo_url, '/mac-onu/lm-arma.png', '/mac-onu/app-store.png', '/mac-onu/google-play.png'];
      list.forEach(function (m) { urls.push(m.home.logoUrl, m.away.logoUrl); });
      return Promise.all(urls.map(loadImg)).then(function (imgs) {
        var img = {};
        urls.forEach(function (u, i) { if (u) img[u] = imgs[i]; });
        list.forEach(function (m) { m.home.logo = img[m.home.logoUrl]; m.away.logo = img[m.away.logoUrl]; });
        return { league: { name: league.name, logo: img[league.logo_url] }, matches: list,
          lm: img['/mac-onu/lm-arma.png'], appStore: img['/mac-onu/app-store.png'], googlePlay: img['/mac-onu/google-play.png'] };
      });
    });
  }
  var COLS = 'select=id,home_team_id,away_team_id,pitch_id,league_id,season_id,week,match_date,match_time,youtube_url,cup_name,cup_round,status';
  function loadData() {
    var mid = q.get('m'), lid = q.get('l'), day = q.get('d');
    if (mid) {
      return get('matches?' + COLS + '&id=eq.' + mid).then(function (r) {
        var m = r[0];
        if (!m) throw new Error('Maç bulunamadı.');
        var lp = m.league_id ? Promise.resolve(m.league_id)
          : get('seasons?select=league_id&id=eq.' + m.season_id).then(function (s) { return s[0] && s[0].league_id; });
        return lp.then(function (leagueId) { return enrich([m], leagueId); });
      }).then(function (d) { d.kind = 'match'; return d; });
    }
    if (lid && day) {
      return get('seasons?select=id&league_id=eq.' + lid).then(function (ss) {
        var or = 'league_id.eq.' + lid + (ss.length ? ',season_id.in.' + inList(ss.map(function (s) { return s.id; })) : '');
        return get('matches?' + COLS + '&match_date=eq.' + day + '&or=(' + or + ')&status=not.in.(cancelled,postponed)&order=match_time.asc.nullslast');
      }).then(function (ms) {
        if (!ms.length) throw new Error('Bu gün için maç yok.');
        return enrich(ms, lid);
      }).then(function (d) { d.kind = 'day'; d.day = day; return d; });
    }
    return Promise.reject(new Error('Bağlantı eksik.'));
  }

  /* ---------------- Zamanlama yardımcıları ---------------- */
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function back(x) { var c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function prog(t, d, dur) { return clamp((t - d) / (dur || 0.7)); }

  /* ---------------- Arka plan: gece stadyumu ---------------- */
  var crowd = (function () {
    var s = 977 + 13, r = function () { return (s = (s * 16807) % 2147483647) / 2147483647; };
    var pal = ['255,255,255', '240,122,34', '120,150,255', '255,210,120', '255,90,90'];
    var a = [];
    for (var i = 0; i < 320; i++) a.push({ x: r(), y: r(), c: pal[Math.floor(r() * pal.length)], a: .15 + r() * .45, p: r() * 6.28, s: .5 + r() * 2 });
    return a;
  })();
  var staticLayer = (function () {
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d'), w = W, h = H, g;
    g = x.createLinearGradient(0, 0, 0, h * .6); g.addColorStop(0, '#03050b'); g.addColorStop(1, '#0d1838');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    var st = h * .3, sb = h * .62;
    g = x.createLinearGradient(0, st, 0, sb); g.addColorStop(0, '#0b1122'); g.addColorStop(1, '#05080f');
    x.fillStyle = g; x.beginPath(); x.moveTo(0, st + h * .03); x.quadraticCurveTo(w / 2, st - h * .03, w, st + h * .03); x.lineTo(w, sb); x.lineTo(0, sb); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.04)'; x.lineWidth = 3;
    for (var i = 1; i < 9; i++) { var y = st + (sb - st) * i / 9, k = h * .02 * (1 - i / 9); x.beginPath(); x.moveTo(0, y + k); x.quadraticCurveTo(w / 2, y - k, w, y + k); x.stroke(); }
    x.fillStyle = '#11151f';
    [.1, .9].forEach(function (px) { x.fillRect(px * w - w * .006, h * .1, w * .012, st - h * .1 + h * .03); });
    for (i = 0; i < 12; i++) {
      var a = sb + (h - sb) * Math.pow(i / 12, 1.5), b = sb + (h - sb) * Math.pow((i + 1) / 12, 1.5);
      x.fillStyle = i % 2 ? '#0f4a26' : '#12572d'; x.fillRect(0, a, w, b - a + 1);
    }
    x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 7;
    var topY = sb + h * .015, hl = sb + (h - sb) * .42;
    x.beginPath(); x.moveTo(w * .12, topY); x.lineTo(w * .88, topY); x.lineTo(w * 1.25, h); x.moveTo(w * .12, topY); x.lineTo(-w * .25, h); x.stroke();
    var half = w * (.76 + (1.5 - .76) * ((hl - topY) / (h - topY))) / 2;
    x.beginPath(); x.moveTo(w / 2 - half, hl); x.lineTo(w / 2 + half, hl); x.stroke();
    x.beginPath(); x.ellipse(w / 2, hl, w * .2, h * .035, 0, 0, Math.PI * 2); x.stroke();
    g = x.createRadialGradient(w / 2, h * .45, w * .3, w / 2, h * .5, h * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.75)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    return c;
  })();
  function drawStadium(t, dim) {
    var x = ctx, w = W, h = H, st = h * .3, sb = h * .62;
    x.drawImage(staticLayer, 0, 0);
    crowd.forEach(function (d) {
      var yy = st + h * .04 + d.y * (sb - st - h * .05);
      var flash = Math.sin(t * 2.3 + d.p * 9) > .985;
      var a = flash ? .95 : d.a * (.55 + .45 * Math.sin(t * d.s + d.p));
      x.fillStyle = 'rgba(' + (flash ? '255,255,255' : d.c) + ',' + a + ')';
      var r = (flash ? 2.2 : 1) * w / 260;
      x.fillRect(d.x * w - r / 2, yy - r / 2, r, r);
    });
    x.globalCompositeOperation = 'lighter';
    [.1, .9].forEach(function (px, i) {
      var lx = px * w, ly = h * .1, fl = .9 + .1 * Math.sin(t * 7 + i * 2), g;
      g = x.createLinearGradient(lx, ly, w / 2, h * .82);
      g.addColorStop(0, 'rgba(200,215,255,' + (.16 * fl) + ')'); g.addColorStop(1, 'rgba(200,215,255,0)');
      x.fillStyle = g; x.beginPath(); x.moveTo(lx - w * .05, ly); x.lineTo(lx + w * .05, ly);
      x.lineTo(w / 2 + (px < .5 ? .1 : .45) * w, h * .9); x.lineTo(w / 2 - (px < .5 ? .45 : .1) * w, h * .9); x.fill();
      g = x.createRadialGradient(lx, ly, 0, lx, ly, w * .42);
      g.addColorStop(0, 'rgba(255,255,255,' + (.85 * fl) + ')'); g.addColorStop(.08, 'rgba(220,230,255,' + (.45 * fl) + ')'); g.addColorStop(1, 'rgba(120,150,255,0)');
      x.fillStyle = g; x.fillRect(lx - w * .45, ly - w * .45, w * .9, w * .9);
      x.fillStyle = 'rgba(255,255,255,.95)';
      for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) x.fillRect(lx - w * .045 + c * w * .024, ly - h * .012 + r * h * .009, w * .016, h * .006);
    });
    var hx = w * (.5 + .2 * Math.sin(t * .15)), g2 = x.createRadialGradient(hx, h * .55, 0, hx, h * .55, w * .8);
    g2.addColorStop(0, 'rgba(160,180,230,.08)'); g2.addColorStop(1, 'rgba(160,180,230,0)');
    x.fillStyle = g2; x.fillRect(0, 0, w, h);
    x.globalCompositeOperation = 'source-over';
    if (dim) { x.fillStyle = 'rgba(4,6,12,' + dim + ')'; x.fillRect(0, 0, w, h); }
  }

  /* ---------------- Çizim yardımcıları ---------------- */
  function font(size, opt) { return (opt && opt.italic ? 'italic ' : '') + '800 ' + size + 'px ' + DISPLAY; }
  function bodyFont(size, weight) { return (weight || 600) + ' ' + size + 'px ' + BODY; }
  function shadow(blur, oy, col) { ctx.shadowColor = col || 'rgba(0,0,0,.8)'; ctx.shadowBlur = blur; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = oy || 0; }
  function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
  // Metni genişliğe göre satırlara böler; tek kelime sığmazsa yazı küçülür.
  function wrap(text, maxW, size, maxLines) {
    var s = size, lines;
    for (;;) {
      ctx.font = font(s);
      var words = text.split(/\s+/), cur = '';
      lines = [];
      words.forEach(function (wd) {
        var tryS = cur ? cur + ' ' + wd : wd;
        if (ctx.measureText(tryS).width <= maxW || !cur) cur = tryS; else { lines.push(cur); cur = wd; }
      });
      if (cur) lines.push(cur);
      var widest = Math.max.apply(null, lines.map(function (l) { return ctx.measureText(l).width; }));
      if ((widest <= maxW && lines.length <= maxLines) || s < size * .55) return { lines: lines, size: s };
      s *= .92;
    }
  }
  function drawLines(w, cx, y, lh) {
    ctx.font = font(w.size); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    w.lines.forEach(function (l, i) { ctx.fillText(l, cx, y + i * w.size * (lh || 1.02)); });
    return w.lines.length * w.size * (lh || 1.02);
  }
  function fitText(text, maxW, size, f) {
    var s = size; ctx.font = f(s);
    while (ctx.measureText(text).width > maxW && s > size * .5) { s *= .95; ctx.font = f(s); }
    return s;
  }
  function logo(img, cx, y, size) {
    if (!img) {
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(cx, y + size / 2, size * .42, 0, 7); ctx.fill(); return;
    }
    var r = Math.min(size / img.width, size / img.height), w = img.width * r, h = img.height * r;
    shadow(3 * U, 1.5 * U, 'rgba(0,0,0,.55)');
    ctx.drawImage(img, cx - w / 2, y + (size - h) / 2, w, h);
    noShadow();
  }
  function withAnim(alpha, dx, dy, fn, rot, scale, ox, oy) {
    if (alpha <= 0) return;
    ctx.save(); ctx.globalAlpha *= alpha;
    ctx.translate((ox || 0) + (dx || 0), (oy || 0) + (dy || 0));
    if (rot) ctx.rotate(rot);
    if (scale && scale !== 1) ctx.scale(scale, scale);
    ctx.translate(-(ox || 0), -(oy || 0));
    fn(); ctx.restore();
  }
  function fadeUp(t, d, fn) { var p = easeOut(prog(t, d)); withAnim(p, 0, (1 - p) * 6 * U, fn); }
  function fadeDown(t, d, fn) { var p = easeOut(prog(t, d)); withAnim(p, 0, -(1 - p) * 6 * U, fn); }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function chip(text, cx, cy, size) {
    ctx.font = font(size); var tw = ctx.measureText(text).width, pw = 2.4 * U, ph = .6 * U;
    ctx.fillStyle = ACCENT; roundRect(cx - tw / 2 - pw, cy - size / 2 - ph, tw + 2 * pw, size + 2 * ph, U); ctx.fill();
    ctx.fillStyle = '#140a02'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, cy + size * .05);
  }
  function eyebrowText(d, m) {
    var tag = m.round ? upper(m.round) : (m.week ? m.week + '. HAFTA' : '');
    return { name: upper(d.league.name), tag: tag };
  }

  /* ---------------- Kapanış kartı (ortak) ---------------- */
  function drawOutro(t, d0) {
    var p = easeOut(prog(t, d0, .6));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = p;
    ctx.translate(W / 2, H / 2); ctx.scale(1.08 - .08 * p, 1.08 - .08 * p); ctx.translate(-W / 2, -H / 2);
    var g = ctx.createRadialGradient(W / 2, H * .38, 0, W / 2, H * .38, H * .7);
    g.addColorStop(0, '#1b2440'); g.addColorStop(1, '#0a0d14');
    ctx.fillStyle = g; ctx.fillRect(-W, -H, 3 * W, 3 * H);
    var y = 46 * U;
    logo(scene.lm, W / 2, y, 30 * U); y += 34 * U;
    ctx.fillStyle = '#fff'; ctx.font = font(11 * U); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('LİG MASASI', W / 2, y); y += 14 * U;
    ctx.fillStyle = '#c9d0de'; ctx.font = bodyFont(4.2 * U);
    ctx.fillText('Canlı skor, kadro ve yayın linki uygulamada', W / 2, y); y += 10 * U;
    var bw = 60 * U;
    if (scene.appStore) { var h1 = bw * scene.appStore.height / scene.appStore.width; ctx.drawImage(scene.appStore, W / 2 - bw / 2, y, bw, h1); y += h1 + 3 * U; }
    if (scene.googlePlay) {
      var h2 = bw * scene.googlePlay.height / scene.googlePlay.width, gw = bw * .78, gh = h2 * .78;
      ctx.globalAlpha = p * .45; ctx.drawImage(scene.googlePlay, W / 2 - gw / 2, y, gw, gh); ctx.globalAlpha = p;
      ctx.fillStyle = '#aab3c4'; ctx.font = bodyFont(3.6 * U, 700); ctx.fillText('Google Play · Yakında', W / 2, y + gh + 1.6 * U); y += gh + 9 * U;
    }
    ctx.fillStyle = '#8d97ab'; ctx.font = bodyFont(3.8 * U); ctx.fillText('ligmasasi.com/indir', W / 2, y + 2 * U);
    ctx.restore();
  }

  /* ---------------- 1 · Karşı Karşıya ---------------- */
  var VS_AT = 3.4, OUTRO_1 = 9.6;
  function drawMatch(t) {

  }

    var src = ac.createBufferSource(); src.buffer = audioBuf; src.connect(ac.destination);
    var t0 = ac.currentTime + .05; src.start(t0);

    var dur = duration();
    (function loop() {
      if (!live) return;
      var t = ac.currentTime - t0;
      draw(Math.max(0, Math.min(t, dur)));

    var L = audioBuf.getChannelData(0), R = audioBuf.getChannelData(1), N = 1024;
    for (var s = 0; s < L.length; s += N) {
      var n = Math.min(N, L.length - s), data = new Float32Array(n * 2);
      data.set(L.subarray(s, s + n), 0); data.set(R.subarray(s, s + n), n);
      var ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(s / 48000 * 1e6), data: data });
      ae.encode(ad); ad.close();
    }
    var i = 0;
    function step() {
      if (err) return Promise.reject(err);
      if (i >= frames) return Promise.all([ve.flush(), ae.flush()]);
      draw(i / FPS);
      var f = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      ve.encode(f, { keyFrame: i % (FPS * 2) === 0 }); f.close();
      i++;
      if (i % 6 === 0) progress(i / frames);
      return (ve.encodeQueueSize > 8 || i % 6 === 0 ? wait(ve.encodeQueueSize > 8 ? 15 : 0) : Promise.resolve()).then(step);
    }
    return step().then(function () {
      if (err) throw err;
      muxer.finalize();
      return new Blob([muxer.target.buffer], { type: 'video/mp4' });
    });
  }
  function recorderType() {
    if (!window.MediaRecorder || !cv.captureStream) return null;
    var types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4'];
    for (var i = 0; i < types.length; i++) if (MediaRecorder.isTypeSupported(types[i])) return types[i];
    return null;
  }
  // Gerçek zamanlı kayıt (ör. iPhone Safari): video süresi kadar sürer.
  function encodeRecorder(type) {
    return new Promise(function (resolve, reject) {
      var dur = duration(), ac = new (window.AudioContext || window.webkitAudioContext)();
      var dest = ac.createMediaStreamDestination(), src = ac.createBufferSource();
      src.buffer = audioBuf; src.connect(dest);
      var stream = cv.captureStream(FPS);
      dest.stream.getAudioTracks().forEach(function (t) { stream.addTrack(t); });
      var rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10e6, audioBitsPerSecond: 192000 }), parts = [];
      rec.ondataavailable = function (e) { if (e.data && e.data.size) parts.push(e.data); };
      rec.onstop = function () { ac.close(); resolve(new Blob(parts, { type: 'video/mp4' })); };
      rec.onerror = function (e) { reject(e.error || new Error('Kayıt hatası')); };
      draw(0); rec.start();
      var t0 = ac.currentTime + .1; src.start(t0);
      (function loop() {
        var t = ac.currentTime - t0;
        draw(Math.max(0, Math.min(t, dur))); progress(Math.max(0, t / dur));
        if (t >= dur + .15) { rec.stop(); return; }
        requestAnimationFrame(loop);
      })();
    });
  }
  function fileName() {
    var m = scene.matches[0];
    return scene.kind === 'match'
      ? 'mac-onu-' + slug(m.home.name) + '-' + slug(m.away.name) + '-' + (m.date || '') + '.mp4'
      : 'gunun-maclari-' + slug(scene.league.name) + '-' + scene.day + '.mp4';
  }
  function make() {
    stopPreview();
    $('make').disabled = $('preview').disabled = true; $('done').hidden = true;
    progress(0); msg('Video hazırlanıyor…');
    webCodecsConfig().then(function (cfg) {
      if (cfg) return encodeWebCodecs(cfg);
      var type = recorderType();
      if (!type) throw new Error('Bu tarayıcı MP4 üretemiyor. Chrome veya Safari\'nin güncel sürümüyle dene.');
      msg('Video kaydediliyor, ' + Math.ceil(duration()) + ' saniye sürer…');
      return encodeRecorder(type);
    }).then(function (blob) {
      videoFile = new File([blob], fileName(), { type: 'video/mp4' });
      progress(1); draw(restTime());
      $('done').hidden = false;
      msg('Video hazır (' + (blob.size / 1048576).toFixed(1) + ' MB). Paylaş ile Instagram\'ı seçebilirsin.');
    }).catch(function (e) {
      msg((e && e.message) || 'Video oluşturulamadı.', true);
    }).then(function () { $('make').disabled = $('preview').disabled = false; });
  }
  function save() {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(videoFile); a.download = videoFile.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
  }
  function share() {
    if (navigator.canShare && navigator.canShare({ files: [videoFile] })) {
      navigator.share({ files: [videoFile] }).catch(function (e) { if (e && e.name !== 'AbortError') save(); });
    } else {
      save();
      msg('Bu tarayıcı doğrudan paylaşamıyor; video indirildi.');
    }
  }

  $('preview').onclick = startPreview;
  $('make').onclick = make;
  $('share').onclick = share;
  $('save').onclick = save;

  Promise.all([loadData(), loadFonts()]).then(function (r) {
    scene = r[0];
    var m = scene.matches[0];
    if (scene.kind === 'match') {
      $('title').textContent = m.home.name + ' – ' + m.away.name;
      $('sub').textContent = 'Karşı Karşıya · ' + [dayLine(m.date), m.time].filter(Boolean).join(' · ');
    } else {
      $('title').textContent = 'Günün Maçları · ' + scene.league.name;
      $('sub').textContent = dayLine(scene.day) + ' · ' + scene.matches.length + ' maç';
    }
    draw(restTime());
    return renderAudio(duration());
  }).then(function (buf) {
    audioBuf = buf;
    $('preview').disabled = $('make').disabled = false;
  }).catch(function (e) {
    $('sub').textContent = '';
    msg((e && e.message) || 'Yüklenemedi.', true);
  });
})();
</script>
</body>
</html>
