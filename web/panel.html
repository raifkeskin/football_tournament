<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yönetim Masası · Lig Masası</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&display=swap">
<style>
/* Yönetim Masası taslağının (yonetim-masasi) görünümü: solda sabit menü,
   üstte turnuva bandı, sağda iş alanı; telefonda menü alta iner. */
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #111a2c;
  --card: #16213a;
  --card-2: #1c2944;
  --line: #24314d;
  --fg: #e6ecf5;
  --muted: #8d9bb4;
  --accent: #10b981;
  --accent-ink: #052e22;
  --live: #f43f5e;
  --warn: #fbbf24;
  --danger: #f87171;
  --lg1: #6d0f22;
  --lg2: #8f1430;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 6px; font: 600 11.5px/1.4 var(--body); color: var(--fg); background: var(--card);
}

/* ---- Giriş ---- */
.login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.login form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; }
.login h1 { font: 800 28px/1.05 var(--display); margin: 20px 0 4px; }
.login p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.login label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
.login input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); outline: none; }
.login input:focus { border-color: var(--accent); }
.login .btn { width: 100%; margin-top: 20px; padding: 12px; font-size: 15px; }
.err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }

/* ---- Menü ---- */
.side {
  background: var(--panel); border-right: 1px solid var(--line);
  padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand img { width: 34px; height: 34px; }
.brand b { font: italic 800 19px/1 var(--display); letter-spacing: 1.6px; }
.nav-btn {
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 9px 10px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); font-weight: 600; text-align: left;
}
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: var(--card); color: var(--fg); }
.nav-btn[aria-current="page"] { background: rgba(16,185,129,.14); color: var(--fg); }
.nav-btn[aria-current="page"] svg { color: var(--accent); }
.nav-btn .count {
  margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px;
  background: var(--warn); color: #3b2a00; font-size: 12px; font-weight: 800; text-align: center;
}
.side .sep { height: 1px; background: var(--line); margin: 10px 4px; }
.side .foot { margin-top: auto; color: var(--muted); font-size: 12.5px; padding: 0 8px; display: grid; gap: 6px; }
.side .foot button { background: none; border: 0; padding: 0; color: var(--danger); font-weight: 700; text-align: left; }

/* ---- Üst bant (seçili turnuvanın rengi) ---- */
.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding-block: 12px;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, var(--lg1), var(--lg2) 55%, var(--lg1));
  border-bottom: 1px solid rgba(255,255,255,.18);
}
.league { display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; }
.league img { width: 32px; height: 32px; object-fit: contain; flex: none; }
.league .shield {
  width: 30px; height: 34px; flex: none;
  clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
  background: linear-gradient(var(--lg2), var(--lg1)); border: 2px solid #fff;
}
.league b { font: italic 800 20px/1 var(--display); letter-spacing: 1.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.league select {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
}
.league .chev { opacity: .8; flex: none; }
.search {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(0,0,0,.22); color: rgba(255,255,255,.85); min-width: 0;
}
.search span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.who i { width: 30px; height: 30px; border-radius: 50%; background: #0f172a; display: grid; place-items: center; font-style: normal; font-size: 12px; border: 2px solid var(--accent); }

.content {
  padding-block: 22px 40px;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; align-content: start;
}
h1 { font: 800 30px/1.05 var(--display); letter-spacing: .3px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.h-row { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.label { font: 800 12px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); margin: 0; }
.label.warn { color: var(--warn); }
.day { display: flex; align-items: center; gap: 6px; }
.day input { padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg); }
.keys { color: var(--muted); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; }

/* Özet kutuları */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; text-align: left; }
button.tile:hover { border-color: #33476e; }
.tile .big { font: 800 34px/1 var(--display); }
.tile .cap { color: var(--muted); font-size: 13.5px; }
.tile.live .big { color: var(--live); }
.tile.warn { border-color: rgba(251,191,36,.45); }
.tile.warn .big { color: var(--warn); }
.tile.ok .big { color: var(--accent); }
.tile.off .big { color: var(--muted); }

.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.box-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
.box-head .hint { color: var(--muted); font-size: 13px; }
.lg-head { padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line); font-weight: 700; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.lg-head img { width: 18px; height: 18px; object-fit: contain; }

/* Liste + sağda maç: maça tıklayınca sağ bölme açılır, liste daralır. */
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
.split.open { grid-template-columns: minmax(440px, .8fr) minmax(0, 1.3fr); }
.listcol { display: grid; gap: 22px; align-content: start; min-width: 0; container-type: inline-size; }
.detail { display: none; min-width: 0; container-type: inline-size; }
.split.open .detail {
  display: grid; gap: 14px; align-content: start;
  position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; padding-right: 2px;
}
.dhead { display: flex; align-items: center; gap: 8px; }
.dhead .sub { margin: 0 auto 0 0; font-size: 13px; }
.dhead .btn { padding: 5px 10px; font-size: 13px; }
@container (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .listcol .keys { display: none; } }

/* Maç satırı (yatay): saat · ev sahibi · skor · deplasman · düğme */
.mrow {
  display: grid; grid-template-columns: 62px minmax(0, 1fr) 96px minmax(0, 1fr) auto;
  gap: 4px 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer;
}
.mrow:hover { background: rgba(255,255,255,.025); }
.mrow.sel { background: rgba(16,185,129,.09); box-shadow: inset 3px 0 0 var(--accent); }
.mrow .time { font: 800 18px/1.05 var(--display); color: var(--muted); }
.mrow .time small { display: block; font-size: 13px; }
.mrow.is-live .time { color: var(--live); }
.mrow .tm { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; }
.mrow .tm.r { justify-content: flex-end; text-align: right; }
.mrow .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tm img, .mrow .tm .dot { width: 24px; height: 24px; flex: none; object-fit: contain; }
.mrow .tm .dot { border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; background: var(--card-2); }
.mrow .sc { text-align: center; font: 800 22px/1 var(--display); }
.mrow .sc.none { color: var(--muted); font-size: 18px; }
.mrow .score-in { justify-content: center; }
.mrow .acts { min-width: 0; }
.mrow .meta { grid-column: 2 / 5; justify-content: center; margin: 0; }
@container (max-width: 560px) {
  .mrow { grid-template-columns: 48px minmax(0, 1fr) 70px minmax(0, 1fr); }
  .mrow .acts { grid-column: 1 / -1; justify-content: center; }
  .mrow .acts:empty { display: none; }
  .mrow .tm img, .mrow .tm .dot { display: none; }
}
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--card-2); border-radius: 9px; padding: 7px 11px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: #3a5180; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.live { background: var(--live); border-color: var(--live); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.pill.live { background: rgba(244,63,94,.15); color: #ff8aa0; }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: blink 1.2s infinite; }
.pill.warn { background: rgba(251,191,36,.15); color: var(--warn); }
.pill.ok { background: rgba(16,185,129,.15); color: #6ee7b7; }
.pill.mute { background: var(--card-2); color: var(--muted); }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.live::before { animation: none; } }
.meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }

/* Satır içi sonuç girişi */
.score-in { display: flex; align-items: center; gap: 6px; }
.score-in input {
  width: 44px; padding: 6px 4px; text-align: center; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 800 17px/1 var(--display);
}
.score-in input:focus { border-color: var(--accent); outline: none; }
.empty { padding: 22px 16px; color: var(--muted); border-top: 1px solid var(--line); text-align: center; }

/* ---- Canlı maç ---- */
.board { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 14px; }
.sb { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
.sb .side-t { display: flex; align-items: center; gap: 10px; min-width: 0; font: 800 22px/1.1 var(--display); }
.sb .side-t.r { justify-content: flex-end; text-align: right; }
.sb .side-t img, .sb .side-t .dot { width: 36px; height: 36px; object-fit: contain; flex: none; }
.sb .side-t .dot { border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-size: 13px; }
.sb .side-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb .mid { text-align: center; }
.sb .score { font: 800 46px/1 var(--display); letter-spacing: 2px; }
.sb .clock { margin-top: 4px; display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
.sb .pens-s { color: var(--warn); font-weight: 700; font-size: 13px; }
.phase { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.phase .grow { flex: 1; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tool { border: 1px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 8px 11px; font-weight: 700; font-size: 13.5px; display: inline-flex; gap: 7px; align-items: center; }
.tool .kbd { padding: 0 5px; }
.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tool[aria-pressed="true"] .kbd { background: rgba(0,0,0,.15); color: var(--accent-ink); border-color: rgba(0,0,0,.2); }
.tool:disabled { opacity: .4; cursor: default; }
.minute { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--muted); font-size: 13px; }
.minute input { width: 58px; padding: 7px 6px; text-align: center; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 800 17px/1 var(--display); }
.hintbar { padding: 10px 14px; border-radius: 12px; background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.35); color: #a7f3d0; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hintbar.idle { background: var(--card); border-color: var(--line); color: var(--muted); font-weight: 500; }
.hintbar .btn { margin-left: auto; }
.lgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.roster { display: grid; gap: 4px; padding: 8px; }
.roster h4 { margin: 8px 6px 2px; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.pl { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: 9px; border: 1px solid transparent; background: transparent; text-align: left; }
.pl:hover { background: var(--card-2); }
.armed .pl:hover { border-color: var(--accent); background: rgba(16,185,129,.12); }
.pl.chosen { border-color: var(--accent); background: rgba(16,185,129,.18); }
.pl .no { width: 26px; height: 26px; border-radius: 7px; background: var(--card-2); display: grid; place-items: center; font: 800 14px/1 var(--display); flex: none; }
.pl .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pl .mk { font-size: 12px; white-space: nowrap; }
.pl.off { opacity: .45; }
.pl:disabled { cursor: default; opacity: .35; }
.evs { display: grid; }
.ev { display: grid; grid-template-columns: 40px 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
.ev .m { font: 800 16px/1 var(--display); color: var(--muted); }
.ev .tx { min-width: 0; }
.ev .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .tx small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.away { background: rgba(255,255,255,.015); }
.ev.cancelled b { text-decoration: line-through; opacity: .6; }
.ev .acts .btn { padding: 4px 8px; font-size: 12px; }
.card-ic { width: 12px; height: 16px; border-radius: 2px; display: inline-block; }
.shoot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.shoot .grp { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; }
.shoot .grp b { font-size: 13px; margin-right: 4px; }
.pick-list { display: grid; }
/* Sağ bölme dar: olaylar esamelerin üstünde (kaydırmadan görünsün),
   esameler yan yana; geniş: esame · olaylar · esame. */
.lgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.lgrid .evbox { grid-column: 1 / -1; order: -1; }
.lgrid .evbox .evs { max-height: 240px; overflow: auto; }
@container (min-width: 1080px) {
  .lgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, 1fr); }
  .lgrid .evbox { grid-column: auto; order: 0; }
  .lgrid .evbox .evs { max-height: none; }
}
@container (max-width: 560px) { .lgrid { grid-template-columns: 1fr; } .sb .score { font-size: 36px; } .sb .side-t { font-size: 17px; } }
/* Dar ekranda sağ bölme listenin yerine geçer; Kapat ile listeye dönülür. */
@media (max-width: 1000px) {
  .split.open { grid-template-columns: minmax(0, 1fr); }
  .split.open .listcol { display: none; }
  .split.open .detail { position: static; max-height: none; overflow: visible; }
}

/* ---- Maç yönetimi şeridi ---- */
.ctl { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; flex-wrap: wrap; }
.ctl .tx { flex: 1; min-width: 180px; display: grid; }
.ctl .tx small { color: var(--muted); }
.ctl .tx i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.ctl .tx i.on { background: var(--accent); } .ctl .tx i.off { background: #64748b; }
.ctl .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.ctl.free { background: var(--card); border: 1px dashed var(--line); }
.ctl.mine { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.45); }
.ctl.mine .av { background: var(--accent); color: var(--accent-ink); }
.ctl.other { background: rgba(96,165,250,.1); border: 1px solid rgba(96,165,250,.4); }
.ctl.other .av { background: rgba(96,165,250,.25); }
.ctl.wait { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.45); }
.ctl.wait .av { background: var(--warn); color: #3b2a00; }
.btn.info { background: #60a5fa; border-color: #60a5fa; color: #06213f; }
.cbar { height: 5px; border-radius: 99px; background: var(--card-2); overflow: hidden; margin-top: 4px; }
.cbar i { display: block; height: 100%; background: var(--warn); transition: width 1s linear; }
.tool:disabled { opacity: .35; }

/* ---- Onaylar ---- */
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; padding: 4px 16px 16px; }
.appr2 { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card-2); display: grid; gap: 6px; align-content: start; cursor: pointer; }
.appr2.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.appr2 .ah { font-weight: 700; font-size: 13.5px; display: flex; gap: 8px; align-items: center; color: var(--muted); }
.appr2 p { margin: 0; }
.appr2 .t { font-weight: 700; }
.appr2 .sub { margin: 0; font-size: 12.5px; }
.appr2 .acts { justify-content: start; margin-top: 4px; }
.appr2 .acts .kbd { margin-left: 4px; }
.appr2 a { color: var(--accent); }
.pill.info { background: rgba(96,165,250,.15); color: #93c5fd; }
.chg { display: grid; gap: 4px; font-size: 13.5px; }
.chg b { color: var(--muted); font-weight: 600; margin-right: 4px; }
.chg img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; vertical-align: middle; }
.ig { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; }
.ig img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500 !important; }
.pen-n { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.pen-n input { width: 46px; padding: 5px; text-align: center; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 800 16px/1 var(--display); }

/* Skor penceresi */
.ov { position: fixed; inset: 0; background: rgba(2,6,23,.7); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side {
    position: fixed; inset: auto 0 0 0; height: auto; z-index: 6; flex-direction: row; gap: 2px;
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) max(6px, env(safe-area-inset-bottom, 0px));
    border-right: 0; border-top: 1px solid var(--line); overflow-x: auto;
  }
  .brand, .side .sep, .side .foot, .nav-btn.more { display: none; }

  .search, .keys { display: none; }
  .who span { display: none; }
}
