<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yönetim Masası · Lig Masası</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&display=swap">
<style>
/* Yönetim Masası taslağının (yonetim-masasi) görünümü: solda sabit menü,
   üstte turnuva bandı, sağda iş alanı; telefonda menü alta iner. */
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #111a2c;
  --card: #16213a;
  --card-2: #1c2944;
  --line: #24314d;
  --fg: #e6ecf5;
  --muted: #8d9bb4;
  --accent: #10b981;
  --accent-ink: #052e22;
  --live: #f43f5e;
  --warn: #fbbf24;
  --danger: #f87171;
  --lg1: #6d0f22;
  --lg2: #8f1430;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.kbd {
  display: inline-block; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 6px; font: 600 11.5px/1.4 var(--body); color: var(--fg); background: var(--card);
}

/* ---- Giriş ---- */
.login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.login form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; }
.login h1 { font: 800 28px/1.05 var(--display); margin: 20px 0 4px; }
.login p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.login label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
.login input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); outline: none; }
.login input:focus { border-color: var(--accent); }
.login .btn { width: 100%; margin-top: 20px; padding: 12px; font-size: 15px; }
.err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }

/* ---- Menü ---- */
.side {
  background: var(--panel); border-right: 1px solid var(--line);
  padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand img { width: 34px; height: 34px; }
.brand b { font: italic 800 19px/1 var(--display); letter-spacing: 1.6px; }
.nav-btn {
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 9px 10px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); font-weight: 600; text-align: left;
}
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: var(--card); color: var(--fg); }
.nav-btn[aria-current="page"] { background: rgba(16,185,129,.14); color: var(--fg); }
.nav-btn[aria-current="page"] svg { color: var(--accent); }
.nav-btn .count {
  margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px;
  background: var(--warn); color: #3b2a00; font-size: 12px; font-weight: 800; text-align: center;
}
.side .sep { height: 1px; background: var(--line); margin: 10px 4px; }
.side .foot { margin-top: auto; color: var(--muted); font-size: 12.5px; padding: 0 8px; display: grid; gap: 6px; }
.side .foot button { background: none; border: 0; padding: 0; color: var(--danger); font-weight: 700; text-align: left; }

/* ---- Üst bant (seçili turnuvanın rengi) ---- */
.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding-block: 12px;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, var(--lg1), var(--lg2) 55%, var(--lg1));
  border-bottom: 1px solid rgba(255,255,255,.18);
}
.league { display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; }
.league img { width: 32px; height: 32px; object-fit: contain; flex: none; }
.league .shield {
  width: 30px; height: 34px; flex: none;
  clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
  background: linear-gradient(var(--lg2), var(--lg1)); border: 2px solid #fff;
}
.league b { font: italic 800 20px/1 var(--display); letter-spacing: 1.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.league select {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
}
.league .chev { opacity: .8; flex: none; }
.search {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(0,0,0,.22); color: rgba(255,255,255,.85); min-width: 0;
}
.search span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.who i { width: 30px; height: 30px; border-radius: 50%; background: #0f172a; display: grid; place-items: center; font-style: normal; font-size: 12px; border: 2px solid var(--accent); }

.content {
  padding-block: 22px 40px;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; align-content: start;
}
h1 { font: 800 30px/1.05 var(--display); letter-spacing: .3px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.h-row { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.label { font: 800 12px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); margin: 0; }
.label.warn { color: var(--warn); }
.day { display: flex; align-items: center; gap: 6px; }
.day input { padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--card-2); color: var(--fg); }
.keys { color: var(--muted); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; }

/* Özet kutuları */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; text-align: left; }
button.tile:hover { border-color: #33476e; }
.tile .big { font: 800 34px/1 var(--display); }
.tile .cap { color: var(--muted); font-size: 13.5px; }
.tile.live .big { color: var(--live); }
.tile.warn { border-color: rgba(251,191,36,.45); }
.tile.warn .big { color: var(--warn); }
.tile.ok .big { color: var(--accent); }
.tile.off .big { color: var(--muted); }

.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.box-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
.box-head .hint { color: var(--muted); font-size: 13px; }
.lg-head { padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line); font-weight: 700; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.lg-head img { width: 18px; height: 18px; object-fit: contain; }

/* Liste + sağda maç: maça tıklayınca sağ bölme açılır, liste daralır. */
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
.split.open { grid-template-columns: minmax(440px, .8fr) minmax(0, 1.3fr); }
.split.open.fixtures-hidden { grid-template-columns: minmax(0, 1fr); }
.listcol { display: grid; gap: 22px; align-content: start; min-width: 0; container-type: inline-size; }
.detail { display: none; min-width: 0; container-type: inline-size; }
.split.open .detail {
  display: grid; gap: 14px; align-content: start;
  position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; padding-right: 2px;
}
.split.open.fixtures-hidden .listcol { display: none; }
.dhead { display: flex; align-items: center; gap: 8px; }
.dhead .sub { margin: 0 auto 0 0; font-size: 13px; }
.dhead .btn { padding: 5px 10px; font-size: 13px; }
@container (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .listcol .keys { display: none; } }

/* Maç satırı (yatay): saat · ev sahibi · skor · deplasman · düğme */
.mrow {
  display: grid; grid-template-columns: 62px minmax(0, 1fr) 96px minmax(0, 1fr) auto;
  gap: 4px 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer;
}
.mrow:hover { background: rgba(255,255,255,.025); }
.mrow.sel { background: rgba(16,185,129,.09); box-shadow: inset 3px 0 0 var(--accent); }
.mrow .time { font: 800 18px/1.05 var(--display); color: var(--muted); }
.mrow .time small { display: block; font-size: 13px; }
.mrow.is-live .time { color: var(--live); }
.mrow .tm { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; }
.mrow .tm.r { justify-content: flex-end; text-align: right; }
.mrow .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tm img, .mrow .tm .dot { width: 24px; height: 24px; flex: none; object-fit: contain; }
.mrow .tm .dot { border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; background: var(--card-2); }
.mrow .sc { text-align: center; font: 800 22px/1 var(--display); }
.mrow .sc.none { color: var(--muted); font-size: 18px; }
.mrow .score-in { justify-content: center; }
.mrow .acts { min-width: 0; }
.mrow .meta { grid-column: 2 / 5; justify-content: center; margin: 0; }
@container (max-width: 560px) {
  .mrow { grid-template-columns: 48px minmax(0, 1fr) 70px minmax(0, 1fr); }
  .mrow .acts { grid-column: 1 / -1; justify-content: center; }
  .mrow .acts:empty { display: none; }
  .mrow .tm img, .mrow .tm .dot { display: none; }
}
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--card-2); border-radius: 9px; padding: 7px 11px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: #3a5180; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.live { background: var(--live); border-color: var(--live); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.pill.live { background: rgba(244,63,94,.15); color: #ff8aa0; }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: blink 1.2s infinite; }
.pill.warn { background: rgba(251,191,36,.15); color: var(--warn); }
.pill.ok { background: rgba(16,185,129,.15); color: #6ee7b7; }
.pill.mute { background: var(--card-2); color: var(--muted); }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.live::before { animation: none; } }
.meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }

/* Satır içi sonuç girişi */
.score-in { display: flex; align-items: center; gap: 6px; }
.score-in input {
  width: 44px; padding: 6px 4px; text-align: center; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 800 17px/1 var(--display);
}
.score-in input:focus { border-color: var(--accent); outline: none; }
.empty { padding: 22px 16px; color: var(--muted); border-top: 1px solid var(--line); text-align: center; }

/* ---- Canlı maç ---- */
.board { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 14px; }
.sb { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
.sb .side-t { display: flex; align-items: center; gap: 10px; min-width: 0; font: 800 22px/1.1 var(--display); }
.sb .side-t.r { justify-content: flex-end; text-align: right; }
.sb .side-t img, .sb .side-t .dot { width: 36px; height: 36px; object-fit: contain; flex: none; }
.sb .side-t .dot { border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-size: 13px; }
.sb .side-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb .mid { text-align: center; }
.sb .score { font: 800 46px/1 var(--display); letter-spacing: 2px; }
.sb .clock { margin-top: 4px; display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
.sb .pens-s { color: var(--warn); font-weight: 700; font-size: 13px; }
.phase { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.phase .grow { flex: 1; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tool { border: 1px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 8px 11px; font-weight: 700; font-size: 13.5px; display: inline-flex; gap: 7px; align-items: center; }
.tool .kbd { padding: 0 5px; }
.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tool[aria-pressed="true"] .kbd { background: rgba(0,0,0,.15); color: var(--accent-ink); border-color: rgba(0,0,0,.2); }
.tool:disabled { opacity: .4; cursor: default; }
.minute { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--muted); font-size: 13px; }
.minute input { width: 58px; padding: 7px 6px; text-align: center; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 800 17px/1 var(--display); }
.hintbar { padding: 10px 14px; border-radius: 12px; background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.35); color: #a7f3d0; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hintbar.idle { background: var(--card); border-color: var(--line); color: var(--muted); font-weight: 500; }
.hintbar .btn { margin-left: auto; }
.lgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.roster { display: grid; gap: 4px; padding: 8px; }
.roster h4 { margin: 8px 6px 2px; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.roster-edit { padding: 4px 8px; font-size: 11.5px; }
.pl { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: 9px; border: 1px solid transparent; background: transparent; text-align: left; }
.pl:hover { background: var(--card-2); }
.armed .pl:hover { border-color: var(--accent); background: rgba(16,185,129,.12); }
.pl.chosen { border-color: var(--accent); background: rgba(16,185,129,.18); }
.pl .no { width: 26px; height: 26px; border-radius: 7px; background: var(--card-2); display: grid; place-items: center; font: 800 14px/1 var(--display); flex: none; }
.pl .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pl .mk { font-size: 12px; white-space: nowrap; }
.pl.off { opacity: .45; }
.pl:disabled { cursor: default; opacity: .35; }
/* Saha görünümü: yedekler iki yanda, oyuncuya tıkla / üstüne gelip harfe bas,
   yedeği sahadakinin üstüne sürükle = değişiklik. */
.pitchgrid { display: grid; grid-template-columns: 136px minmax(0, 1fr) 136px; gap: 10px; align-items: stretch; }
.bench { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.bench .bench-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.bench h4 { margin: 2px 4px 0; font: 700 12.5px/1.2 var(--display); letter-spacing: 1.2px; color: var(--accent); }
.bench small { margin: 0 4px 4px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bp { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); text-align: left; font-weight: 600; font-size: 12.5px; line-height: 1.15; touch-action: none; cursor: grab; }
.bp .no { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--display); flex: none; background: #1d4ed8; color: #fff; }
.bench.a .bp .no { background: #e6ecf5; color: #0b1220; }
.bp .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bp .mk { font-size: 11px; }
.bp.chosen { border-color: var(--accent); background: rgba(16,185,129,.18); }
.bp.drag { opacity: .45; border-style: dashed; border-color: var(--accent); }
.bp:disabled { cursor: default; opacity: .4; }
.pitch { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid #1f6f3c; aspect-ratio: 16 / 10; min-height: 340px; background: repeating-linear-gradient(90deg, #14532d 0 9.09%, #166534 9.09% 18.18%); }
.pitch .ln { position: absolute; border: 2px solid rgba(255,255,255,.32); pointer-events: none; }
.pitch .tm { position: absolute; top: 10px; font: 800 13px/1 var(--display); letter-spacing: 1px; color: rgba(255,255,255,.72); max-width: 44%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
.tk { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 2px; color: #fff; max-width: 112px; z-index: 1; }
.tk .dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 16px/1 var(--display); border: 2px solid rgba(255,255,255,.9); box-shadow: 0 2px 6px rgba(0,0,0,.5); background: #1d4ed8; color: #fff; transition: box-shadow .12s; }
.tk.a .dot { background: #f1f5f9; color: #0b1220; }
.tk .nm { font-weight: 700; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 108px; }
.tk .mk { font-size: 11px; line-height: 1; min-height: 11px; }
.tk:not(:disabled):hover .dot { box-shadow: 0 0 0 3px var(--warn), 0 0 0 7px rgba(251,191,36,.25); }
.tk.chosen .dot, .tk.menu .dot { box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px rgba(16,185,129,.25); }
.tk.drop .dot { box-shadow: 0 0 0 3px var(--accent), 0 0 0 9px rgba(16,185,129,.3); transform: scale(1.08); }
.tk.off { opacity: .45; }
.tk:disabled { cursor: default; }
.pmenu { position: absolute; z-index: 5; width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.55); padding: 6px; }
.pmenu .hd { padding: 4px 8px 7px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.pmenu .hd b { display: block; font-size: 14px; }
.pmenu .hd small { color: var(--muted); font-size: 11.5px; }
.pmenu button { display: flex; width: 100%; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 8px; background: transparent; border: 0; font-weight: 700; font-size: 13px; text-align: left; }
.pmenu button:hover, .pmenu button:focus-visible { background: var(--card-2); }
.pmenu button:disabled { opacity: .4; cursor: default; }
.pmenu button .kbd { margin-left: auto; }
.dghost { position: fixed; z-index: 60; pointer-events: none; display: flex; align-items: center; gap: 6px; background: #f8fafc; color: #0b1220; border-radius: 999px; padding: 5px 11px 5px 5px; font-weight: 800; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.45); transform: translate(-50%, -120%) rotate(-3deg); }
.dghost .no { width: 22px; height: 22px; border-radius: 50%; background: #1d4ed8; color: #fff; display: grid; place-items: center; font: 800 12px/1 var(--display); }
.evfull .evs { max-height: 260px; overflow: auto; }
@container (max-width: 760px) {
  .pitchgrid { grid-template-columns: 1fr 1fr; }
  .pitchgrid .pitch { grid-column: 1 / -1; order: -1; min-height: 260px; }
}
.evs { display: grid; }
.ev { display: grid; grid-template-columns: 40px 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
.ev .m { font: 800 16px/1 var(--display); color: var(--muted); }
.ev .tx { min-width: 0; }

  // Turnuva renginden üst bant: ana renk ve biraz koyusu.
  function shade(hex, f) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return null;
    var n = parseInt(m[1], 16);
    var c = [n >> 16, (n >> 8) & 255, n & 255].map(function (v) { return Math.round(v * f); });
    return 'rgb(' + c.join(',') + ')';
  }

  // ---------- oturum ----------
  function saveSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SKEY, JSON.stringify(s));
      else localStorage.removeItem(SKEY);
    } catch (e) {}
  }
  function loadSession() {
    try { session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { session = null; }
  }
  function authCall(grant, body) {
    return fetch(BASE + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST',
      headers: {apikey: KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Giriş başarısız');
        return j;
      });
    });
  }
  // Uygulamadaki gibi: 10 haneli telefon (başında 0 olabilir) hesabın
  // e-posta adına çevrilir; e-posta yazıldıysa doğrudan kullanılır.
  function loginId(raw) {
    raw = raw.trim();
    if (raw.indexOf('@') > 0) return {email: raw};
    var d = raw.replace(/\D/g, '');
    if (d.length === 11 && d[0] === '0') d = d.slice(1);
    if (d.length === 12 && d.slice(0, 2) === '90') d = d.slice(2);
    if (d.length === 10) return {email: d + '@masterclass.com'};
    return {phone: raw};
  }
  function token() {
    if (!session) return Promise.reject(new Error('Oturum yok'));
    if (session.expires_at && session.expires_at * 1000 > Date.now() + 60000) {
      return Promise.resolve(session.access_token);
    }
    return authCall('refresh_token', {refresh_token: session.refresh_token}).then(function (s) {
      saveSession(s);
      return s.access_token;
    }, function (e) {
      saveSession(null);
      render();
      throw e;
    });
  }
  function api(path, opts) {
    opts = opts || {};
    return token().then(function (t) {
      var h = {apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json'};
      if (opts.prefer) h.Prefer = opts.prefer;
      return fetch(BASE + '/rest/v1/' + path, {
        method: opts.method || 'GET',
        headers: h,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
    }).then(function (r) {
      if (r.status === 204) return null;
      return r.text().then(function (txt) {
        var j = txt ? JSON.parse(txt) : null;
        if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Hata ' + r.status));
        return j;
      });
    });
  }

  // ---------- giriş ekranı ----------
  function renderLogin() {
    root.innerHTML =
      '<div class="login"><form id="lf">' +
      '<div class="brand" style="padding:0"><img src="/logo-lm.png" alt=""><b>LİG MASASI</b></div>' +
      '<h1>Yönetim Masası</h1>' +
      '<p>Turnuva ve bölge sorumluları için.<br>Uygulamadaki hesabınızla girin.</p>' +
      '<label for="lp">Telefon</label><input id="lp" autocomplete="username" inputmode="numeric" placeholder="(5XX) XXX XX XX" maxlength="15" required>' +
      '<label for="lw">Şifre</label><input id="lw" type="password" autocomplete="current-password" required>' +
      '<button class="btn primary" id="lb">Giriş yap</button>' +
      '<div class="err" id="le"></div>' +
      '</form></div>';
    var lp = document.getElementById('lp');
    lp.focus();
    // Uygulamadaki telefon alanı gibi: yalnız rakam, (5XX) XXX XX XX;
    // baştaki 0 / 90 atılır, 10 haneden fazlası alınmaz.
    lp.addEventListener('input', function () {
      var d = lp.value.replace(/\D/g, '');
      if (d.length > 10 && d.slice(0, 2) === '90') d = d.slice(2);
      if (d[0] === '0') d = d.slice(1);
      d = d.slice(0, 10);
      // Ayraç yalnız sonraki hane yazılınca eklenir (silerken takılmasın).
      var out = d.length ? '(' + d.slice(0, 3) : '';
      if (d.length > 3) out += ') ' + d.slice(3, 6);
      if (d.length > 6) out += ' ' + d.slice(6, 8);
      if (d.length > 8) out += ' ' + d.slice(8);
      lp.value = out;
    });
    document.getElementById('lf').onsubmit = function (e) {
      e.preventDefault();
      var b = document.getElementById('lb');
      b.disabled = true;
      var body = loginId(document.getElementById('lp').value);
      body.password = document.getElementById('lw').value;
      authCall('password', body).then(function (s) {
        saveSession(s);
        state.data = null;
        render();
      }, function (err) {
        b.disabled = false;
        document.getElementById('le').textContent =
          /invalid/i.test(err.message) ? 'Telefon ya da şifre hatalı.' : err.message;
      });
    };
  }

  // ---------- veri ----------
  function load() {
    var d = state.date;
    return api('rpc/desk_matches', {method: 'POST', body: {p_date: d}}).then(function (j) {
      if (d !== state.date) return;
      state.data = j;
      var ls = j.leagues || [];
      // Seçili turnuva artık listede yoksa: tek turnuvaysa o, değilse tümü.
      if (state.league && !ls.some(function (l) { return l.id === state.league; })) state.league = null;
      if (!state.league && ls.length === 1) state.league = ls[0].id;
      syncSel();
      renderTop();
      if (document.getElementById('listcol')) renderList();
      else renderContent();
      if (state.view === 'live' && !state.liveId) pickFirstLive();
    }, function (e) {
      if (session) toast(e.message, true);
    });
  }
  function currentLeague() {
    var ls = (state.data && state.data.leagues) || [];
    for (var i = 0; i < ls.length; i++) if (ls[i].id === state.league) return ls[i];
    return null;
  }
  function matches() {
    var m = (state.data && state.data.matches) || [];
    return state.league ? m.filter(function (x) { return x.league_id === state.league; }) : m;
  }
  // Klavyeyle gezilen sıra: önce günün maçları, sonra sonucu bekleyenler.
  function rows() {
    var m = matches();
    return m.filter(function (x) { return !x.overdue; }).concat(m.filter(function (x) { return x.overdue; }));
  }
  // Seçili satır, sağda açık maçın satırıdır.
  function syncSel() {
    if (!state.liveId) return;
    var all = rows();
    for (var i = 0; i < all.length; i++) if (all[i].id === state.liveId) { state.sel = i; return; }
  }
  function setDate(d) {
    state.date = d;
    state.sel = -1;
    renderList();
    load();
  }

  // ---------- iskelet ----------
  function render() {
    if (!session) return renderLogin();
    var nav = NAV.map(function (n) {
      if (n.sep) return '<div class="sep"></div>';
      return '<button class="nav-btn' + (n.more ? ' more' : '') + '" data-view="' + n.id + '"' +
        (state.view === n.id ? ' aria-current="page"' : '') + '>' + ICON[n.id] + esc(n.name) + '</button>';
    }).join('');
    var u = session.user || {};
    var who = (u.email || '').replace('@masterclass.com', '') || u.phone || '';
    root.innerHTML =
      '<div class="app"><nav class="side" aria-label="Menü">' +
      '<div class="brand"><img src="/logo-lm.png" alt=""><b>LİG MASASI</b></div>' + nav +
      '<div class="foot"><span>' + esc(who) + '</span><button id="lo">Çıkış yap</button></div>' +
      '</nav><div class="main"><header class="top" id="top"></header><main class="content" id="content"></main></div></div>';
    Array.prototype.forEach.call(root.querySelectorAll('.nav-btn'), function (b) {
      b.onclick = function () { go(b.getAttribute('data-view')); };
    });
    document.getElementById('lo').onclick = function () {
      token().then(function (t) {
        fetch(BASE + '/auth/v1/logout', {method: 'POST', headers: {apikey: KEY, Authorization: 'Bearer ' + t}});
      }).catch(function () {});
      saveSession(null);
      state.data = null;
      state.appr = null;
      clearInterval(apprTimer);
      closeLive();
      render();
    };
    renderTop();
    renderContent();
    if (!state.data) load();
    if (state.liveId) startPoll();
    startApprPoll();
  }

  // Bugün ve Canlı maç aynı ekrandır (liste + sağda maç); Canlı maç menüsü
  // açık maç yoksa ilk canlı maçı açar.
  function go(view) {
    state.view = view;
    if (view !== 'today' && view !== 'live') closeLive();
    syncHash();
    Array.prototype.forEach.call(root.querySelectorAll('.nav-btn'), function (b) {
      if (b.getAttribute('data-view') === view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    renderContent();
    if (view === 'live' && !state.liveId) pickFirstLive();
  }
  function pickFirstLive() {
    var all = rows().filter(function (m) { return !m.overdue; });
    var m = all.filter(function (x) { return x.status === 'live' || x.status === 'halftime'; })[0] ||
      all.filter(function (x) { return x.status === 'notStarted'; })[0];
    if (m) openLive(m.id);
  }

  function renderTop() {
    var top = document.getElementById('top');
    if (!top) return;
    var ls = (state.data && state.data.leagues) || [];
    var cur = currentLeague();
    var r = document.documentElement.style;
    var c1 = cur && shade(cur.primary, .55), c2 = cur && shade(cur.primary, .8);
    r.setProperty('--lg1', c1 || '#0a3b2c');
    r.setProperty('--lg2', c2 || '#0d6b4c');
    var name = cur ? cur.name : (ls.length ? 'Tüm turnuvalarım' : 'Yönetim Masası');
    var u = session.user || {};
    var meta = u.user_metadata || {};
    var full = meta.full_name || meta.name || '';
    var opts = ls.length > 1
      ? '<select id="ls" aria-label="Turnuva seç"><option value="">Tüm turnuvalarım</option>' +
        ls.map(function (l) {
          return '<option value="' + esc(l.id) + '"' + (l.id === state.league ? ' selected' : '') + '>' + esc(l.name) + '</option>';
        }).join('') + '</select>'
      : '';
    top.innerHTML =
      '<div class="league">' +
      (cur && cur.logo ? '<img src="' + esc(cur.logo) + '" alt="">' : '<div class="shield"></div>') +
      '<b>' + esc(name) + '</b>' + (opts ? ICON.chev + opts : '') + '</div>' +
      '<div class="search" role="button" tabindex="0" title="Ara (Ctrl K)">' + ICON.search + '<span>Maç, takım, oyuncu ara</span><span class="kbd">Ctrl K</span></div>' +
      (full ? '<div class="who"><i>' + esc(initials(full)) + '</i><span>' + esc(full) + '</span></div>' : '');
    top.querySelector('.search').onclick = openSearch;
    var sel = document.getElementById('ls');
    if (sel) sel.onchange = function () {
      state.league = sel.value || null;
      try {
        if (state.league) localStorage.setItem(LKEY, state.league);
        else localStorage.removeItem(LKEY);
      } catch (e) {}
      state.sel = -1;
      syncSel();
      renderTop();
      updateApprCount();
      state.season = null;
      state.fxWeek = null;
      state.teamSel = null;
      if (state.view === 'today' || state.view === 'live') renderList();
      else renderContent();
    };
  }

  function renderContent() {
    var el = document.getElementById('content');
    if (!el) return;
    if (state.view === 'today' || state.view === 'live') {
      el.innerHTML = '<div class="split' + (state.liveId ? ' open' : '') + (state.fixturesHidden ? ' fixtures-hidden' : '') + '" id="split">' +
        '<div class="listcol" id="listcol"></div><section class="detail" id="detail" aria-label="Maç"></section></div>';
      renderList();
      renderDetail();
      return;
    }
    if (state.view === 'approvals') return renderApprovals(el);
    if (SEASON_VIEWS[state.view]) return renderSeasonView(el);
    state.view = 'today';
    renderContent();
  }

  // ---------- Maç listesi ----------
  function teamHtml(name, logo, score) {
    return '<div class="team">' +
      (logo ? '<img src="' + esc(logo) + '" alt="">' : '<span class="dot">' + esc(initials(name)) + '</span>') +
      '<span>' + esc(name) + '</span>' + (score == null ? '' : '<em class="num">' + score + '</em>') + '</div>';
  }
  function crest(name, logo) {
    return logo ? '<img src="' + esc(logo) + '" alt="">' : '<span class="dot">' + esc(initials(name)) + '</span>';
  }
  function metaOf(m) {
    var bits = [];
    if (m.status === 'live' || m.status === 'halftime') bits.push('<span class="pill live">' + (m.status === 'live' ? 'CANLI' : 'DEVRE ARASI') + '</span>');
    else if (m.status === 'finished') bits.push('<span class="pill ok">BİTTİ</span>');
    else if (m.status === 'postponed') bits.push('<span class="pill warn">ERTELENDİ</span>');
    else if (m.status === 'cancelled') bits.push('<span class="pill warn">İPTAL</span>');
    var t = [state.league ? '' : m.league, m.group, m.cup_round || (m.week ? m.week + '. hafta' : '')].filter(Boolean).join(' · ');
    if (t) bits.push('<span>' + esc(t) + '</span>');
    if (m.hp != null && m.ap != null) bits.push('<span class="pill mute">Penaltı ' + m.hp + '–' + m.ap + '</span>');
    return '<div class="meta">' + bits.join('') + '</div>';
  }
  // Yatay satır: saat · ev sahibi · skor · deplasman · düğme. Satıra
  // tıklayınca maç sağda açılır.
  function matchRow(m, i) {
    var live = m.status === 'live' || m.status === 'halftime';
    var played = live || m.status === 'finished';
    var score = played
      ? '<div class="sc num">' + m.hs + ' – ' + m.as + '</div>'
      : '<div class="sc num none">–</div>';
    var btn = m.status === 'finished'
      ? '<button class="btn ghost" data-score="' + i + '">Düzelt</button>'
      : live ? '' : '<button class="btn primary" data-score="' + i + '">Skor gir</button>';
    return '<div class="mrow' + (live ? ' is-live' : '') + (i === state.sel ? ' sel' : '') + '" data-i="' + i + '">' +
      '<div class="time num">' + esc((m.time || '').slice(0, 5) || '--:--') + '</div>' +
      '<div class="tm r"><span>' + esc(m.home) + '</span>' + crest(m.home, m.home_logo) + '</div>' + score +
      '<div class="tm">' + crest(m.away, m.away_logo) + '<span>' + esc(m.away) + '</span></div>' +
      '<div class="acts">' + btn + '</div>' + metaOf(m) + '</div>';
  }
  function overdueRow(m, i) {
    return '<div class="mrow' + (i === state.sel ? ' sel' : '') + '" data-i="' + i + '">' +
      '<div class="time num"><small>' + esc(shortDate(m.date)) + '</small>' + esc((m.time || '').slice(0, 5)) + '</div>' +
      '<div class="tm r"><span>' + esc(m.home) + '</span>' + crest(m.home, m.home_logo) + '</div>' +
      '<div class="score-in"><input class="num" inputmode="numeric" maxlength="2" placeholder="–" aria-label="' + esc(m.home) + ' skoru" data-h="' + i + '">' +
      '<span>–</span><input class="num" inputmode="numeric" maxlength="2" placeholder="–" aria-label="' + esc(m.away) + ' skoru" data-a="' + i + '"></div>' +
      '<div class="tm">' + crest(m.away, m.away_logo) + '<span>' + esc(m.away) + '</span></div>' +
      '<div class="acts"><button class="btn primary" data-quick="' + i + '">Kaydet</button></div>' + metaOf(m) + '</div>';
  }
  // Turnuva seçili değilse maçlar turnuva başlıklarıyla ayrılır.
  function grouped(list, offset, fn) {
    var html = '', last = null;
    list.forEach(function (m, k) {
      if (!state.league && m.league_id !== last) {
        html += '<div class="lg-head">' + (m.league_logo ? '<img src="' + esc(m.league_logo) + '" alt="">' : '') + esc(m.league || 'Turnuva') + '</div>';
        last = m.league_id;
      }
      html += fn(m, offset + k);
    });
    return html;
  }

  function renderList() {
    var el = document.getElementById('listcol');
    if (!el) return;
    var all = rows();
    var day = all.filter(function (m) { return !m.overdue; });
    var over = all.filter(function (m) { return m.overdue; });
    var liveN = day.filter(function (m) { return m.status === 'live' || m.status === 'halftime'; }).length;
    var waitN = day.filter(function (m) { return m.status === 'notStarted'; }).length;
    var doneN = day.filter(function (m) { return m.status === 'finished'; }).length;
    var cur = currentLeague();
    var sub = cur ? cur.name : 'Yönettiğiniz turnuvalar';
    var w = dayWord(state.date);
    var dayLabel = (w === 'Bugün' ? 'Bugünün' : w === 'Dün' ? 'Dünün' : w === 'Yarın' ? 'Yarının' : w) + ' maçları';
    var body;
    if (!state.data) {
      body = '<div class="box"><div class="empty" style="border:0">Yükleniyor…</div></div>';
    } else if (!state.data.can) {
      body = '<div class="box"><div class="empty" style="border:0">Bu panel turnuva ve bölge sorumluları içindir.<br>Hesabınızda yönetim yetkisi görünmüyor.</div></div>';
    } else {
      body =
        '<div class="tiles">' +
        '<div class="tile live"><span class="big num">' + liveN + '</span><span class="cap">maç şu an canlı</span></div>' +
        '<div class="tile"><span class="big num">' + waitN + '</span><span class="cap">maç oynanacak</span></div>' +
        '<div class="tile ok"><span class="big num">' + doneN + '</span><span class="cap">maç bitti</span></div>' +
        '<div class="tile' + (over.length ? ' warn' : ' off') + '"><span class="big num">' + over.length + '</span><span class="cap">maçın sonucu girilmedi</span></div>' +
        '</div>' +
        '<section class="box"><div class="box-head"><h2 class="label">' + esc(dayLabel) + '</h2>' +
        '<span class="hint">' + day.length + ' maç · tıklayınca sağda açılır</span></div>' +
        (day.length ? grouped(day, 0, matchRow) : '<div class="empty">Bu gün yönettiğiniz maç yok.</div>') +
        '</section>';
      if (over.length) {
        body += '<section class="box"><div class="box-head"><h2 class="label warn">Sonucu girilmemiş maçlar</h2>' +
          '<span class="hint">Skoru yazıp kaydedin; olaylar sonra eklenebilir</span></div>' +
          grouped(over, day.length, overdueRow) + '</section>';
      }
    }
    el.innerHTML =
      '<div class="h-row"><div><h1>' + esc(w) + ' · ' + esc(longDate(state.date)) + '</h1>' +
      '<p class="sub">' + esc(sub) + '</p></div>' +
      '<div class="day"><button class="btn" id="dp" title="Önceki gün (←)">‹</button>' +
      '<input type="date" id="dd" value="' + state.date + '">' +
      '<button class="btn" id="dn" title="Sonraki gün (→)">›</button>' +
      (state.date !== today() ? '<button class="btn" id="dt">Bugün</button>' : '') + '</div></div>' +
      body +
      '<div class="keys"><span><span class="kbd">←</span> <span class="kbd">→</span> gün</span><span><span class="kbd">↑</span> <span class="kbd">↓</span> maç</span><span><span class="kbd">Enter</span> skor</span><span><span class="kbd">B</span> bugün</span><span><span class="kbd">Esc</span> maçı kapat</span></div>';
    document.getElementById('dp').onclick = function () { setDate(addDays(state.date, -1)); };
    document.getElementById('dn').onclick = function () { setDate(addDays(state.date, 1)); };
    var dt = document.getElementById('dt');
    if (dt) dt.onclick = function () { setDate(today()); };
    document.getElementById('dd').onchange = function (e) { if (e.target.value) setDate(e.target.value); };

    Array.prototype.forEach.call(el.querySelectorAll('.mrow'), function (row) {
      var i = +row.getAttribute('data-i');
      row.onclick = function (e) {
        var t = e.target;
        if (t.tagName === 'INPUT') return;
        state.sel = i;
        if (t.hasAttribute('data-score')) return openScore(all[i]);
        if (t.hasAttribute('data-quick')) return quickSave(all[i], row, t);
        openLive(all[i].id);
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll('.score-in input'), function (inp) {
      inp.addEventListener('input', function () {
        inp.value = inp.value.replace(/\D/g, '');
        if (inp.value.length === 1 && inp.hasAttribute('data-h')) inp.parentNode.querySelector('[data-a]').focus();
      });
      inp.addEventListener('focus', function () { inp.select(); });
      inp.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var row = inp.closest('.mrow');
        quickSave(all[+row.getAttribute('data-i')], row, row.querySelector('[data-quick]'));
      });
    });
  }

  function highlight() {
    Array.prototype.forEach.call(document.querySelectorAll('.mrow'), function (el) {
      var on = +el.getAttribute('data-i') === state.sel;
      el.classList.toggle('sel', on);
      if (on) el.scrollIntoView({block: 'nearest'});
    });
  }

  // Sonucu girilmemiş maç: satırdaki kutulardan kaydet. Eleme maçı berabere
  // yazılırsa penaltı için skor penceresi açılır.
  function quickSave(m, row, btn) {
    var h = row.querySelector('[data-h]'), a = row.querySelector('[data-a]');
    if (h.value === '' || a.value === '') {
      toast('İki skoru da yazın.', true);
      (h.value === '' ? h : a).focus();
      return;
    }
    var hs = +h.value, as = +a.value;
    if (m.knockout && hs === as) return openScore(m, hs, as);
    btn.disabled = true;
    saveScore(m, hs, as, null, null).then(function () {
      toast('Kaydedildi: ' + m.home + ' ' + hs + '–' + as + ' ' + m.away);
      load();
      if (state.liveId === m.id) loadLive();
    }, function (e) {
      btn.disabled = false;
      toast(e.message, true);
    });
  }

  // ---------- skor penceresi ----------
  // Uygulamadaki hızlı skor girişiyle aynı: skor yazılır, maç "Bitti" olur;
  // eleme maçı berabereyse penaltı skoru istenir. Haber, bildirim, puan
  // tablosu veritabanı tetikleyicileriyle güncellenir.
  function openScore(m, preH, preA) {
    if (!m) return;
    var has = m.status === 'finished' || m.hs || m.as;
    var vh = preH != null ? preH : has ? m.hs : '';
    var va = preA != null ? preA : has ? m.as : '';
    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML =
      '<div class="dlg" role="dialog" aria-modal="true">' +
      '<h3>' + esc(m.home) + ' – ' + esc(m.away) + '</h3>' +
      '<div class="sub">' + esc([m.league, shortDate(m.date) + ' ' + (m.time || '').slice(0, 5)].join(' · ')) +
      (m.status !== 'finished' ? ' · kaydedince maç bitmiş sayılır' : '') + '</div>' +
      '<div class="pair"><div><div class="t">' + esc(m.home) + '</div><input id="sh" class="num" inputmode="numeric" maxlength="2" value="' + vh + '"></div>' +
      '<div class="dash">–</div>' +
      '<div><div class="t">' + esc(m.away) + '</div><input id="sa" class="num" inputmode="numeric" maxlength="2" value="' + va + '"></div></div>' +
      '<div class="pens" id="pens" hidden><div class="lbl">Eleme maçı berabere bitemez: penaltı skoru</div>' +
      '<div class="pair"><input id="ph" class="num" inputmode="numeric" maxlength="2" value="' + (m.hp != null ? m.hp : '') + '"><div class="dash">–</div>' +
      '<input id="pa" class="num" inputmode="numeric" maxlength="2" value="' + (m.ap != null ? m.ap : '') + '"></div></div>' +
      '<div class="acts"><span class="hint"><span class="kbd">Enter</span> kaydet · <span class="kbd">Esc</span> vazgeç</span>' +
      '<button class="btn" id="sc">Vazgeç</button><button class="btn primary" id="ss">Kaydet</button></div>' +
      '</div>';
    document.body.appendChild(ov);
    state.dlg = ov;
    var sh = ov.querySelector('#sh'), sa = ov.querySelector('#sa');
    var ph = ov.querySelector('#ph'), pa = ov.querySelector('#pa');
    function num(el) { var v = parseInt(el.value, 10); return isNaN(v) ? null : v; }
    function needsPens() { return m.knockout && (num(sh) || 0) === (num(sa) || 0); }
    function sync() { ov.querySelector('#pens').hidden = !needsPens(); }
    [sh, sa, ph, pa].forEach(function (el) {
      el.addEventListener('focus', function () { el.select(); });
      el.addEventListener('input', function () {
        el.value = el.value.replace(/\D/g, '');
        sync();
        // Tek hane yazılınca sıradaki kutuya geçilir.
        if (el.value.length === 1) {
          if (el === sh) sa.focus();
          else if (el === ph) pa.focus();
        }
      });
    });
    sync();
    function close() {
      ov.remove();
      state.dlg = null;
    }
    function save() {
      var btn = ov.querySelector('#ss');
      if (btn.disabled) return;
      var hs = num(sh) || 0, as = num(sa) || 0;
      var hp = num(ph), ap = num(pa);
      var pens = needsPens();
      if (pens && (hp == null || ap == null || hp === ap)) {
        toast('Eleme maçı berabere bitemez: penaltı skorunu girin.', true);
        (hp == null ? ph : pa).focus();
        return;
      }
      btn.disabled = true;
      saveScore(m, hs, as, pens ? hp : null, pens ? ap : null).then(function () {
        close();
        toast('Kaydedildi: ' + m.home + ' ' + hs + '–' + as + ' ' + m.away);
        load();
        if (state.liveId === m.id) loadLive();
      }, function (e) {
        btn.disabled = false;
        toast(e.message, true);
      });
    }
    ov.querySelector('#sc').onclick = close;
    ov.querySelector('#ss').onclick = save;
    ov.onclick = function (e) { if (e.target === ov) close(); };
    ov.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Enter') { e.preventDefault(); save(); }
    });
    if (preH != null) { sync(); ph.focus(); } else sh.focus();
  }

  function saveScore(m, hs, as, hp, ap) {
    var body = {home_score: hs, away_score: as, is_completed: true, status: 'finished'};
    if (m.knockout) {
      body.home_pens = hp;
      body.away_pens = ap;
      body.shootout = null;
    }
    return api('matches?id=eq.' + m.id + '&select=id', {method: 'PATCH', body: body, prefer: 'return=representation'})
      .then(function (r) {
        // Başladı/devre/bitti satırları yazılmaz; maç detayı bunları maç
        // durumundan üretir (uygulamadaki hızlı skor girişi gibi).
        if (!r || !r.length) throw new Error('Bu maçı düzenleme yetkiniz yok.');
      });
  }

  // ---------- Canlı maç ----------
  // Akış: olay türü seçilir (tuş ya da düğme), sonra oyuncuya tıklanır.
  // Golde ardından asist (ya da Enter: asistsiz), değişiklikte giren oyuncu
  // seçilir. Dakika maç saatinden kendiliğinden gelir, elle değiştirilebilir.
  // Skor, ceza, bildirim ve haber veritabanında güncellenir
  // (desk_add_event + tetikleyiciler).
  var MODES = [
    {id: 'goal', key: 'G', name: 'Gol', icon: '⚽'},
    {id: 'pen_goal', key: 'P', name: 'Penaltı golü', icon: '🎯'},
    {id: 'own_goal', key: 'O', name: 'Kendi kalesine', icon: '🔄'},
    {id: 'pen_miss', key: 'X', name: 'Kaçan penaltı', icon: '✖️'},
    {id: 'yellow', key: 'S', name: 'Sarı kart', icon: '<i class="card-ic" style="background:#facc15"></i>'},
    {id: 'red', key: 'R', name: 'Kırmızı kart', icon: '<i class="card-ic" style="background:#ef4444"></i>'},
    {id: 'sub', key: 'D', name: 'Değişiklik', icon: '↔️'},
    {id: 'motm', key: 'Y', name: 'Maçın adamı', icon: '⭐'}
  ];
  var MODE_HINT = {
    goal: 'Golü atan oyuncuyu seçin',
    pen_goal: 'Penaltıyı gole çeviren oyuncuyu seçin',
    own_goal: 'Kendi kalesine atan oyuncuyu seçin (skor rakibe yazılır)',
    pen_miss: 'Penaltıyı kaçıran oyuncuyu seçin',
    yellow: 'Sarı kart gören oyuncuyu seçin',
    red: 'Kırmızı kart gören oyuncuyu seçin',
    sub: 'Çıkan oyuncuyu seçin (sahadakiler)',
    motm: 'Maçın adamını seçin'
  };
  var liveTimer = null, tickTimer = null;

  function syncHash() {
    var h = state.liveId ? '#mac/' + state.liveId : state.view === 'live' ? '#canli' : '';
    if (location.hash !== h) history.replaceState(null, '', h || location.pathname);
  }
  function readHash() {
    var m = /^#(mac|canli)(?:\/([0-9a-f-]{36}))?$/.exec(location.hash);
    if (!m) return;
    state.view = m[1] === 'canli' ? 'live' : 'today';
    state.liveId = m[2] || null;
  }
  // Maçı sağda aç (liste yerinde kalır); başka maça tıklanınca sağ taraf
  // o maça geçer.
  function openLive(id) {
    if (state.liveId !== id) {
      state.liveId = id;
      state.fixturesHidden = false;
      state.live = null;
      state.liveSig = '';
      state.mode = null;
      state.pick = null;
      state.minuteManual = false;
      state.ctl = null;
      state.ctlSig = '';
    }
    syncSel();
    highlight();
    var sp = document.getElementById('split');
    if (sp) sp.classList.add('open');
    syncHash();
    renderDetail();
    startPoll();
  }
  function closeLive() {
    state.liveId = null;
    state.fixturesHidden = false;
    state.live = null;
    state.liveSig = '';
    state.mode = null;
    state.pick = null;
    stopPoll();
    var sp = document.getElementById('split');
    if (sp) sp.classList.remove('open');
    syncHash();
    renderDetail();
  }
  function loadLive() {
    var id = state.liveId;
    if (!id) return Promise.resolve();
    return api('rpc/desk_match', {method: 'POST', body: {p_match_id: id}}).then(function (d) {
      if (id !== state.liveId) return;
      state.offset = Date.parse(d.now) - Date.now();
      var sig = JSON.stringify(d, function (k, v) { return k === 'now' ? undefined : v; });
      annotate(d);
      state.live = d;
      if (sig !== state.liveSig) {
        state.liveSig = sig;
        renderDetail();
      }
      if (!state.ctl || state.ctl.match !== d.id) loadCtl();
      // Listedeki satır da güncel kalsın (skor, durum).
      var m = ((state.data && state.data.matches) || []).filter(function (x) { return x.id === d.id; })[0];
      if (m && m.status !== d.status) load();
      else if (m && (m.hs !== d.hs || m.as !== d.as || m.hp !== d.hp || m.ap !== d.ap)) {
        m.hs = d.hs; m.as = d.as; m.hp = d.hp; m.ap = d.ap;
        renderList();
      }
    }, function (e) { toast(e.message, true); });
  }
  // Başka cihazdan girilen olaylar da görünsün: maç açıkken 10 sn'de bir.
  function startPoll() {
    stopPoll();
    liveTimer = setInterval(function () {
      if (document.hidden || state.dlg || state.pick || state.menu || state.dragging) return;
      loadLive();
    }, 10000);
    tickTimer = setInterval(tick, 5000);
    startCtlPoll();
  }
  function stopPoll() {
    clearInterval(liveTimer);
    clearInterval(tickTimer);
    clearInterval(ctlTimer);
    liveTimer = tickTimer = ctlTimer = null;
  }

  // Maçın dakikası (uygulamadaki canlı dakika gibi): ilk yarı başlangıçtan,
  // ikinci yarı devre süresinden, uzatma iki devreden sonra sayılır.
  function curMinute(d) {
    if (!d || !d.kickoff_at) return null;
    var now = Date.now() + state.offset;
    function since(t) { return Math.max(0, Math.floor((now - Date.parse(t)) / 60000)) + 1; }
    if (d.status === 'halftime') return d.period;
    if (d.status === 'finished') return null;
    if (d.extra_time_at) return 2 * d.period + since(d.extra_time_at);
    if (d.second_half_at) return d.period + since(d.second_half_at);
    return since(d.kickoff_at);
  }
  // Olay girişindeki dakika (uygulamadaki MatchClock gibi): devre süresi
  // dolunca devre sonu + uzatma (30+2'). Uzatma devresinde düz dakika.
  function minParts(d) {
    var mn = curMinute(d);
    if (mn == null) return null;
    if (d.status !== 'live' || d.extra_time_at || d.shootout) return {minute: mn, added: null};
    var limit = d.second_half_at ? 2 * d.period : d.period;
    return mn > limit ? {minute: limit, added: Math.min(30, mn - limit)} : {minute: mn, added: null};
  }
  function minLabel(m, a) {
    if (m == null || m === 999) return '';
    return a > 0 ? m + '+' + a + '\'' : m + '\'';
  }
  function partsText(p) { return p == null ? '' : p.added ? p.minute + '+' + p.added : String(p.minute); }
  function clockText(d) {
    if (d.status === 'notStarted') return '<span class="pill mute">BAŞLAMADI</span>';
    if (d.status === 'postponed') return '<span class="pill warn">ERTELENDİ</span>';
    if (d.status === 'cancelled') return '<span class="pill warn">İPTAL</span>';
    if (d.status === 'finished') return '<span class="pill ok">MAÇ BİTTİ</span>';
    if (d.status === 'halftime') return '<span class="pill live">DEVRE ARASI</span>';
    if (d.shootout) return '<span class="pill live">PENALTILAR</span>';
    var mp = minParts(d);
    var part = d.extra_time_at ? 'UZATMA' : d.second_half_at ? '2. YARI' : '1. YARI';
    return '<span class="pill live" id="lclock">' + part + ' · ' + minLabel(mp.minute, mp.added) + '</span>';
  }
  function tick() {
    var d = state.live;
    if (!d || !state.liveId) return;
    var c = document.getElementById('lclock');
    if (c && d.status === 'live' && !d.shootout) {
      var part = d.extra_time_at ? 'UZATMA' : d.second_half_at ? '2. YARI' : '1. YARI';
      var mp = minParts(d);
      c.textContent = part + ' · ' + minLabel(mp.minute, mp.added);
    }
    var mi = document.getElementById('lmin');
    if (mi && !state.minuteManual && document.activeElement !== mi) {
      mi.value = partsText(minParts(d));
    }
  }

  // Aynı oyuncunun ikinci sarısı: ihraç (veritabanındaki match_on_pitch_at
  // ile aynı kural). Olaylar dakika sırasıyla gelir.
  function annotate(d) {
    var y = {};
    d.events.forEach(function (e) {
      if (e.type !== 'yellow_card') return;
      y[e.player_id] = (y[e.player_id] || 0) + 1;
      e.second = y[e.player_id] >= 2;
    });
  }
  // Oyundan atılanlar: kırmızı kart ya da ikinci sarı.
  function sentOffMap(d) {
    var m = {};
    d.events.forEach(function (e) { if (e.type === 'red_card' || (e.type === 'yellow_card' && e.second)) m[e.player_id] = true; });
    return m;
  }

  // Oyuncu yanındaki işaretler: gol, kart, değişiklik.
  function marks(d) {
    var mk = {};
    function add(id, s) { if (id) mk[id] = (mk[id] || '') + s; }
    d.events.forEach(function (e) {
      if (e.type === 'goal') add(e.player_id, e.own ? '🔄' : '⚽');
      else if (e.type === 'yellow_card') add(e.player_id, e.second ? '<i class="card2" title="Çift sarıdan ihraç"></i>' : '🟨');
      else if (e.type === 'red_card') add(e.player_id, '🟥');
      else if (e.type === 'substitution') { add(e.player_id, '🔻'); add(e.sub_in_id, '🔺'); }
      else if (e.type === 'man_of_the_match') add(e.player_id, '⭐');
    });
    return mk;
  }

  // O an sahadakiler (veritabanındaki match_on_pitch ile aynı kural): ilk 11,
  // sonra değişiklikler sırayla; kırmızı kart gören sahadan iner.
  function onPitch(d, teamId) {
    var on = {};
    d.roster.forEach(function (r) { if (r.team_id === teamId && r.starting) on[r.player_id] = true; });
    d.events.forEach(function (e) {
      if (e.team_id !== teamId) return;
      if (e.type === 'substitution') {
        delete on[e.player_id];
        if (e.sub_in_id) on[e.sub_in_id] = true;
      } else if (e.type === 'red_card' || (e.type === 'yellow_card' && e.second)) delete on[e.player_id];
    });
    return on;
  }

  function rosterSignature(rows, includeLayout) {
    return rows.map(function (r) {
      var fields = [
        r.player_id,
        r.is_starting === true ? '1' : '0',
        r.jersey_number == null ? '' : String(r.jersey_number).trim(),
        r.is_captain === true ? '1' : '0'
      ];
      if (includeLayout) fields.push(r.list_order == null ? '' : r.list_order, r.pos_x == null ? '' : r.pos_x);
      return fields.join('|');
    }).sort().join(',');
  }

  function editRoster(teamId) {
    if (state.dlg || !state.live || !state.liveId) return;
    var d = state.live, matchId = d.id, isHome = teamId === d.home_id;
    var teamName = isHome ? d.home : d.away;
    var saving = false;
    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="dlg roster-dlg" role="dialog" aria-modal="true">' +
      '<h3>Esameyi düzenle</h3><div class="sub">' + esc(teamName) + ' · ' +
      esc(shortDate(d.date) + ' ' + (d.time || '').slice(0, 5)) + '</div>' +
      '<div class="empty" style="border:0">Kadro yükleniyor…</div></div>';
    document.body.appendChild(ov);
    state.dlg = ov;

    function close(force) {
      if (saving && !force) return;
      if (state.dlg !== ov) return;
      ov.remove();
      state.dlg = null;
    }

    function fail(err) {
      close();
      toast('Esame açılamadı: ' + err.message, true);
    }

    function getEligiblePlayers(seasonId) {
      var path = 'season_team_players?select=player_id,jersey_number,players!inner(id,name,surname,birth_date,main_position)' +
        '&team_id=eq.' + encodeURIComponent(teamId) +
        '&season_id=eq.' + encodeURIComponent(seasonId) +
        '&is_active=eq.true';
      return api(path).then(function (rows) {
        return rows.map(function (row) {
          var p = Array.isArray(row.players) ? row.players[0] : row.players;
          if (!p) return null;
          return {
            id: String(p.id || row.player_id),
            name: [p.name, p.surname].filter(Boolean).join(' ').trim(),
            number: row.jersey_number == null ? '' : row.jersey_number,
            birthDate: p.birth_date,
            position: p.main_position || '',
            selected: false,
            starting: false,
            captain: false,
            saved: false,
            slot: null
          };
        }).filter(function (p) { return p && p.id && p.name; });
      });
    }

    function getVerified(ids) {
      var verified = {};
      var jobs = [];
      for (var i = 0; i < ids.length; i += 150) {
        var part = ids.slice(i, i + 150);
        jobs.push(api('player_verifications?select=player_id&player_id=in.(' + part.join(',') + ')')
          .then(function (rows) {
            rows.forEach(function (r) { verified[r.player_id] = true; });
          }));
      }
      return Promise.all(jobs).then(function () { return verified; });
    }

    function load() {
      return Promise.all([
        api('matches?id=eq.' + encodeURIComponent(matchId) +
          '&select=id,season_id,league_id,home_team_id,away_team_id'),
        api('match_rosters?select=player_id,team_id,is_starting,jersey_number,is_captain,list_order,pos_x' +
          '&match_id=eq.' + encodeURIComponent(matchId) +
          '&team_id=eq.' + encodeURIComponent(teamId))
      ]).then(function (loaded) {
        var matchRows = loaded[0], savedRoster = loaded[1];
        var match = matchRows && matchRows[0];
        if (!match || !match.season_id) throw new Error('Maçın sezon bilgisi bulunamadı.');
        var startSignature = rosterSignature(savedRoster, true);
        var displayed = d.roster.filter(function (r) { return r.team_id === teamId; });
        var displayedSignature = rosterSignature(displayed.map(function (r) {
          return {
            player_id: r.player_id,
            is_starting: r.starting,
            jersey_number: r.no,
            is_captain: r.captain
          };
        }));
        if (rosterSignature(savedRoster) !== displayedSignature) {
          throw new Error('Esame başka bir kullanıcı tarafından güncellenmiş. Maçı yenileyip tekrar açın.');
        }
        return api('seasons?id=eq.' + encodeURIComponent(match.season_id) +
          '&select=league_id,starting_player_count,sub_player_count,age_rules,require_verified_id')
          .then(function (seasons) {
            var season = seasons && seasons[0];
            if (!season) throw new Error('Sezon kuralları bulunamadı.');
            return Promise.all([
              getEligiblePlayers(match.season_id),
              api('player_penalties?select=player_id&season_id=eq.' +
                encodeURIComponent(match.season_id) +
                '&is_active=eq.true')
            ]).then(function (values) {
              var players = values[0], penalties = {};
              values[1].forEach(function (p) {
                if (!p.status || p.status === 'approved') penalties[p.player_id] = true;
              });
              var byId = {};
              players.forEach(function (p) { byId[p.id] = p; });
              displayed.forEach(function (r) {
                var existing = byId[r.player_id];
                if (!existing) {
                  existing = {
                    id: r.player_id, name: r.name, number: r.no, birthDate: null,
                    position: r.pos || '', selected: false, starting: false,
                    captain: false, saved: false, slot: r.slot
                  };
                  players.push(existing);
                  byId[r.player_id] = existing;
                }
                existing.selected = true;
                existing.starting = r.starting === true;
                existing.captain = r.captain === true;
                existing.saved = true;
                existing.number = r.no == null ? '' : r.no;
                existing.slot = r.slot;
              });
              players.forEach(function (p) {
                p.verified = false;
                p.penalized = !!penalties[p.id];
              });
              var ids = players.map(function (p) { return p.id; });
              var check = season.require_verified_id ? getVerified(ids) : Promise.resolve({});
              return check.then(function (verified) {
                players.forEach(function (p) { p.verified = !!verified[p.id]; });
                players.sort(function (a, b) {
                  if (a.selected !== b.selected) return a.selected ? -1 : 1;
                  if (a.starting !== b.starting) return a.starting ? -1 : 1;
                  return a.name.localeCompare(b.name, 'tr');
                });
                render(players, savedRoster, startSignature, {
                  seasonId: match.season_id,
                  leagueId: match.league_id || season.league_id || d.league_id,
                  startingLimit: season.starting_player_count == null ? 11 : Number(season.starting_player_count),
                  subLimit: season.sub_player_count == null ? 7 : Number(season.sub_player_count),
                  requireVerified: season.require_verified_id === true,
                  ageRules: season.age_rules || {}
                });
              });
            });
          });
      });
    }

    function render(players, savedRoster, startSignature, config) {
      var rows = players.map(function (p) {
        var disallowNew = p.penalized && !p.selected;
        var extra = p.penalized ? ' · Cezalı' : '';
        if (config.requireVerified && !p.verified) extra += ' · Kimlik onaysız';
        return '<div class="roster-row" data-player="' + esc(p.id) + '" data-saved="' + p.saved + '">' +
          '<input type="checkbox" data-include aria-label="' + esc(p.name) + ' esameye dahil et"' +
          (p.selected ? ' checked' : '') + (disallowNew ? ' disabled' : '') + '>' +
          '<span class="rp-name" title="' + esc(p.name + extra) + '">' + esc(p.name) +
          (extra ? ' <small>' + esc(extra) + '</small>' : '') + '</span>' +
          '<select data-role aria-label="' + esc(p.name) + ' görev"' + (p.selected ? '' : ' disabled') + '>' +
          '<option value="starter"' + (p.starting ? ' selected' : '') + '>İlk 11</option>' +
          '<option value="sub"' + (!p.starting ? ' selected' : '') + '>Yedek</option></select>' +
          '<input type="text" inputmode="numeric" data-number aria-label="' + esc(p.name) + ' forma numarası" value="' +
          esc(p.number == null ? '' : p.number) + '"' + (p.selected ? '' : ' disabled') + '>' +
          '<label><input type="radio" name="rosterCaptain" data-captain value="' + esc(p.id) + '"' +
          (p.captain ? ' checked' : '') + (p.selected && p.starting ? '' : ' disabled') + '> Kaptan</label>' +
          '</div>';
      }).join('');
      ov.innerHTML = '<div class="dlg roster-dlg" role="dialog" aria-modal="true">' +

  function rosterHtml(d, teamId, mk) {

  // ---------- Saha görünümü ----------
  // Uygulamadaki diziliş (formation_tab.dart) ile aynı kural: kayıtlı saha
  // sırası (pos_x) → mevkilere göre otomatik. 11'li maçta kayıtlı diziliş
  // yoksa 4-2-3-1. Mevkisi girilmemiş oyuncular boş kalan yerlere dağılır.
  var CLASSIC10 = ['4-4-2', '4-3-3', '4-2-3-1', '4-5-1', '4-1-4-1', '3-5-2', '3-4-3', '5-3-2', '5-4-1'];
  function posLine(a, b) {
    var ps = [a, b];
    for (var i = 0; i < 2; i++) {
      var p = String(ps[i] || '').trim().toLocaleLowerCase('tr');
      if (!p) continue;
      if (p.indexOf('kaleci') >= 0 || p === 'gk') return 0;
      if (p.indexOf('forvet') >= 0 || p.indexOf('santrfor') >= 0 || p === 'for') return 3;
      if (p.indexOf('defans') >= 0 || p.indexOf('stoper') >= 0 || p.indexOf('bek') >= 0 || p === 'def') return 1;
      if (p.indexOf('orta') >= 0 || p.indexOf('numara') >= 0 || p.indexOf('kanat') >= 0 || p.indexOf('merkez') >= 0 || p === 'ort') return 2;
    }
    return -1;
  }
  function posWide(a, b) {
    var p = (String(a || '') + ' ' + String(b || '')).toLocaleLowerCase('tr');
    return /bek|kanat|sağ|sol/.test(p);
  }
  function jersey(r) { return r.no == null ? 999 : r.no; }
  function parseF(f) {
    return String(f || '').split('-').map(function (x) { return parseInt(x, 10) || 0; }).filter(function (x) { return x > 0; });
  }
  function fOptions(n) {
    if (n === 10) return CLASSIC10.slice();
    var out = [];
    for (var d = 1; d <= n - 2; d++) for (var m = 1; m <= n - d - 1; m++) out.push(d + '-' + m + '-' + (n - d - m));
    return out;
  }
  function snapF(f, n) {
    var opts = fOptions(n);
    if (!opts.length || opts.indexOf(f) >= 0) return f;
    function shape(x) {
      var c = parseF(x);
      if (!c.length) return [0, 0, 0];
      if (c.length === 1) return [c[0], 0, 0];
      var mid = c.slice(1, -1).reduce(function (a, b) { return a + b; }, 0);
      return [c[0], mid, c[c.length - 1]];
    }
    var s = shape(f), best = opts[0], bd = 1e9;
    opts.forEach(function (o) {
      var t = shape(o), dist = Math.abs(t[0] - s[0]) + Math.abs(t[1] - s[1]) + Math.abs(t[2] - s[2]);
      if (dist < bd) { bd = dist; best = o; }
    });
    return best;
  }
  // Hattı kenar oyuncular iki uca, merkezdekiler ortaya gelecek şekilde dizer.
  function arrangeLine(l) {
    var s = l.slice().sort(function (a, b) { return jersey(a.r) - jersey(b.r); });
    var wide = s.filter(function (x) { return x.wide; }), mid = s.filter(function (x) { return !x.wide; });
    var h = Math.ceil(wide.length / 2);
    return wide.slice(0, h).concat(mid, wide.slice(h));
  }
  // İlk 11'in hatları: [kaleci], sonra defanstan hücuma.
  function startLayout(d, teamId) {
    var st = d.roster.filter(function (r) { return r.team_id === teamId && r.starting; });
    if (!st.length) return null;
    var slots = st.map(function (r) { return r.slot; });
    var fully = slots.every(function (x) { return x != null; }) &&
      slots.filter(function (x, i) { return slots.indexOf(x) === i; }).length === st.length;
    var keepers = st.filter(function (r) { return r.slot === 0; });
    var chosenGk = !fully && keepers.length === 1 ? keepers[0].player_id : null;
    var items = st.map(function (r) {
      var nat = posLine(r.pos, r.pos2);
      if (chosenGk) nat = r.player_id === chosenGk ? 0 : (nat === 0 ? 1 : nat);
      return {r: r, line: nat, wide: posWide(r.pos, r.pos2)};
    });
    // Kaleci: tek kişi; fazlası defansa. Yoksa mevkisizlerden, o da yoksa
    // herkesten en düşük numaralı oyuncu.
    var gks = items.filter(function (x) { return x.line === 0; }).sort(function (a, b) { return jersey(a.r) - jersey(b.r); });
    gks.slice(1).forEach(function (x) { x.line = 1; });
    var gk = gks[0];
    if (!gk) {
      var pool = items.filter(function (x) { return x.line < 0; });
      if (!pool.length) pool = items;
      gk = pool.slice().sort(function (a, b) { return jersey(a.r) - jersey(b.r); })[0];
      gk.line = 0;
    }
    var out = items.filter(function (x) { return x !== gk; });
    var n = out.length;
    var cnt = [0, 0, 0];
    out.forEach(function (x) { cnt[x.line < 0 ? 1 : x.line - 1]++; });
    var auto = snapF(cnt.filter(function (c) { return c > 0; }).join('-'), n);
    var fallback = n === 10 ? '4-2-3-1' : auto;
    var f = String((teamId === d.home_id ? d.home_formation : d.away_formation) || '').trim() || fallback;
    var counts = parseF(f), opts = fOptions(n);
    if (counts.reduce(function (a, b) { return a + b; }, 0) !== n || (opts.length && opts.indexOf(f) < 0)) {
      f = fallback;
      counts = parseF(f);
    }
    // Hatların türü: ilki defans, sonuncusu forvet, aradakiler orta saha.
    var lines = counts.map(function (c, i) {
      return {cap: c, cat: i === 0 ? 1 : i === counts.length - 1 ? 3 : 2, ps: []};
    });
    var left = [];
    [1, 2, 3].forEach(function (cat) {
      out.filter(function (x) { return x.line === cat; })
        .sort(function (a, b) { return jersey(a.r) - jersey(b.r); })
        .forEach(function (x) {
          var l = lines.filter(function (y) { return y.cat === cat && y.ps.length < y.cap; })[0];
          if (l) l.ps.push(x); else left.push(x);
        });
    });
    // Sığmayanlar ve mevkisizler boş kalan yerlere (defansçı öne, forvet
    // arkaya).
    left = left.concat(out.filter(function (x) { return x.line < 0; }));
    left.sort(function (a, b) { return ((a.line < 0 ? 2 : a.line) - (b.line < 0 ? 2 : b.line)) || (jersey(a.r) - jersey(b.r)); });
    lines.forEach(function (l) { while (l.ps.length < l.cap && left.length) l.ps.push(left.shift()); });
    var res = [[gk]].concat(lines.map(function (l) { return arrangeLine(l.ps); }));
    if (fully) {
      // Kayıtlı saha sırası (uygulamada elle dizilmiş) aynen kullanılır.
      var byId = {};
      items.forEach(function (x) { byId[x.r.player_id] = x; });
      var order = st.slice().sort(function (a, b) { return a.slot - b.slot; }).map(function (r) { return byId[r.player_id]; });
      var k = 0;
      res = res.map(function (l) { return l.map(function () { return order[k++]; }); });
    }
    return {formation: f, auto: f !== String((teamId === d.home_id ? d.home_formation : d.away_formation) || '').trim(),
      lines: res.map(function (l) { return l.map(function (x) { return x.r.player_id; }); })};
  }
  // Değişiklikte giren oyuncu çıkanın yerine geçer.
  function liveLayout(d, teamId) {
    var lay = startLayout(d, teamId);
    if (!lay) return null;
    d.events.forEach(function (e) {
      if (e.team_id !== teamId || e.type !== 'substitution' || !e.sub_in_id) return;
      lay.lines.forEach(function (l) {
        var i = l.indexOf(e.player_id);
        if (i >= 0) l[i] = e.sub_in_id;
      });
    });
    return lay;
  }
  function shortName(n) {
    n = String(n || '').trim();
    if (n.length <= 14) return n;
    var p = n.split(/\s+/);
    return p.length > 1 ? p[0] + ' ' + p[p.length - 1].charAt(0) + '.' : n;
  }
  function rosterOf(d, id) { return d.roster.filter(function (r) { return r.player_id === id; })[0]; }
  function canPitch(d) {
    return state.pitchView && d.roster.some(function (r) { return r.starting && r.team_id === d.home_id; }) &&
      d.roster.some(function (r) { return r.starting && r.team_id === d.away_id; });
  }

  function pitchHtml(d, mk) {
    var sentOff = sentOffMap(d);
    var locked = isLocked(), pk = state.pick, sub = state.mode === 'sub';
    var html = '';
    var fs = [];
    [[d.home_id, true], [d.away_id, false]].forEach(function (t) {
      var teamId = t[0], home = t[1];
      var lay = liveLayout(d, teamId);
      fs.push(lay.formation + (lay.auto ? ' · otomatik' : ''));
      var L = lay.lines.length - 1;
      lay.lines.forEach(function (l, li) {
        var x = li === 0 ? 5 : 6 + li * (38 / Math.max(1, L));
        if (!home) x = 100 - x;
        l.forEach(function (id, i) {
          var y = 9 + (i + 0.5) * (82 / l.length);
          if (!home) y = 100 - y;
          var r = rosterOf(d, id) || {name: '', no: null};
          var lock = locked || !!sentOff[id] || (pk && pk.team !== teamId) || (sub && pk && pk.step === 'in');
          var cls = 'tk ' + (home ? 'h' : 'a') + (sentOff[id] ? ' off' : '') + (pk && pk.player === id ? ' chosen' : '') +
            (state.menu && state.menu.pid === id ? ' menu' : '');
          html += '<button class="' + cls + '" data-tk="' + esc(id) + '" data-team="' + esc(teamId) + '" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%"' +
            (lock ? ' disabled' : '') + ' title="' + esc(r.name) + '">' +
            '<span class="dot">' + (r.no == null ? '–' : r.no) + '</span><span class="nm">' + esc(shortName(r.name)) + (r.captain ? ' (K)' : '') + '</span>' +
            '<span class="mk">' + (mk[id] || '') + '</span></button>';
