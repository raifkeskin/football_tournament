    });
    var lines = '<span class="ln" style="inset:12px"></span><span class="ln" style="top:12px;bottom:12px;left:50%;border-width:0 0 0 2px"></span>' +
      '<span class="ln" style="left:50%;top:50%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%"></span>' +
      '<span class="ln" style="left:12px;top:30%;height:40%;width:11%;border-left:0"></span>' +
      '<span class="ln" style="right:12px;top:30%;height:40%;width:11%;border-right:0"></span>';
    return '<div class="pitch" id="pitch">' + lines +
      '<span class="tm" style="left:16px">' + esc(d.home) + ' · ' + esc(fs[0]) + ' →</span>' +
      '<span class="tm" style="right:16px;text-align:right">← ' + esc(fs[1]) + ' · ' + esc(d.away) + '</span>' +
      html + '</div>';
  }
  function benchHtml(d, teamId, mk, home) {
    var lay = liveLayout(d, teamId);
    var on = {};
    lay.lines.forEach(function (l) { l.forEach(function (id) { on[id] = true; }); });
    var sentOff = sentOffMap(d), out = {};
    d.events.forEach(function (e) {
      if (e.type === 'substitution' && e.team_id === teamId) out[e.player_id] = true;
    });
    var locked = isLocked(), pk = state.pick, sub = state.mode === 'sub';
    var list = d.roster.filter(function (r) { return r.team_id === teamId && !on[r.player_id]; });
    var rows = list.map(function (r) {
      var id = r.player_id;
      var used = !!out[id] || !!sentOff[id];
      var lock = locked || used || (pk && pk.team !== teamId) || (sub && !pk);
      return '<button class="bp' + (pk && pk.player === id ? ' chosen' : '') + '" data-bp="' + esc(id) + '" data-team="' + esc(teamId) + '"' + (lock ? ' disabled' : '') +
        ' title="' + esc(r.name) + (used ? '' : ' · sahadaki oyuncunun üstüne sürükleyin') + '">' +
        '<span class="no">' + (r.no == null ? '–' : r.no) + '</span><span class="nm">' + esc(r.name) + '</span>' +
        '<span class="mk">' + (mk[id] || '') + '</span></button>';
    }).join('');
    return '<div class="bench ' + (home ? 'h' : 'a') + '">' +
      '<div class="bench-head"><h4>YEDEKLER</h4><button class="btn ghost roster-edit" data-roster-edit data-team="' +
      esc(teamId) + '" title="Esameyi düzenle">Düzenle</button></div><small>' +
      esc(home ? d.home : d.away) + '</small>' +
      (rows || '<small>Yedek yok</small>') + '</div>';
  }

  // Oyuncu menüsü: olay türleri; seçilince olay hemen o oyuncuya girilir.
  function openMenu(pid, teamId) {
    state.mode = null;
    state.pick = null;
    state.menu = {pid: pid, team: teamId};
    renderDetail();
  }
  function closeMenu() {
    if (!state.menu) return;
    state.menu = null;
    var m = document.getElementById('pmenu');
    if (m) m.remove();
    Array.prototype.forEach.call(document.querySelectorAll('.tk.menu'), function (t) { t.classList.remove('menu'); });
  }
  function drawMenu() {
    var mn = state.menu, pitch = document.getElementById('pitch');
    if (!mn || !pitch) return;
    var tk = pitch.querySelector('[data-tk="' + mn.pid + '"]');
    if (!tk) { state.menu = null; return; }
    var d = state.live, finished = d.status === 'finished';
    var r = rosterOf(d, mn.pid) || {name: ''};
    var mv = d.track_minutes ? partsText(minParts(d)) : '';
    var mi = document.getElementById('lmin');
    if (mi && mi.value) mv = mi.value;
    var div = document.createElement('div');
    div.className = 'pmenu';
    div.id = 'pmenu';
    div.setAttribute('role', 'menu');
    div.innerHTML = '<div class="hd"><b>' + (r.no == null ? '' : r.no + ' · ') + esc(r.name) + '</b>' +
      '<small>' + (d.track_minutes ? 'Dakika ' + esc(mv || '–') + ' · değiştirmek için M' : 'Dakika tutulmuyor') + '</small></div>' +
      MODES.map(function (x) {
        var dis = x.id === 'motm' && !finished;
        return '<button role="menuitem" data-mi="' + x.id + '"' + (dis ? ' disabled title="Maç bittikten sonra"' : '') + '>' +
          x.icon + ' ' + esc(x.name) + ' <span class="kbd">' + x.key + '</span></button>';
      }).join('');
    pitch.appendChild(div);
    var pw = pitch.clientWidth, ph = pitch.clientHeight;
    var cx = tk.offsetLeft, cy = tk.offsetTop;
    var w = div.offsetWidth, h = div.offsetHeight;
    var lx = cx + 30;
    if (lx + w > pw - 6) lx = cx - 30 - w;
    var ty = Math.max(6, Math.min(ph - h - 6, cy - h / 2));
    div.style.left = Math.max(6, lx) + 'px';
    div.style.top = ty + 'px';
    Array.prototype.forEach.call(div.querySelectorAll('[data-mi]'), function (b) {
      b.onclick = function () { quickEvent(b.getAttribute('data-mi'), mn.pid, mn.team); };
    });
    var first = div.querySelector('[data-mi]');
    if (first) first.focus();
  }
  function quickEvent(modeId, pid, teamId) {
    closeMenu();
    state.pick = null;
    if (state.live.track_minutes && modeId !== 'motm' && minuteVal() == null) {
      toast('Dakikayı yazın.', true);
      var mi = document.getElementById('lmin');
      if (mi) mi.focus();
      return;
    }
    state.mode = modeId;
    pickPlayer(pid, teamId);
  }

  // Yedeği sahadaki oyuncunun üstüne sürükle → değişiklik (fare ve dokunma).
  function bindDrag(el) {
    Array.prototype.forEach.call(el.querySelectorAll('[data-bp]'), function (b) {
      b.addEventListener('pointerdown', function (ev) {
        if (b.disabled || ev.button > 0 || state.pick || state.mode) return;
        var sx = ev.clientX, sy = ev.clientY, ghost = null, target = null;
        var pid = b.getAttribute('data-bp'), team = b.getAttribute('data-team');
        b.setPointerCapture(ev.pointerId);
        function at(x, y) {
          var t = document.elementFromPoint(x, y);
          t = t && t.closest ? t.closest('[data-tk]') : null;
          return t && !t.disabled && t.getAttribute('data-team') === team ? t : null;
        }
        function move(e) {
          if (!ghost) {
            if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 7) return;
            closeMenu();
            state.dragging = true;
            b.classList.add('drag');
            ghost = document.createElement('div');
            ghost.className = 'dghost';
            ghost.innerHTML = b.querySelector('.no').outerHTML + '<span>' + esc(nameOf(pid)) + '</span>';
            document.body.appendChild(ghost);
          }
          ghost.style.left = e.clientX + 'px';
          ghost.style.top = e.clientY + 'px';
          var t = at(e.clientX, e.clientY);
          if (t !== target) {
            if (target) target.classList.remove('drop');
            target = t;
            if (target) target.classList.add('drop');
          }
        }
        function up() {
          b.removeEventListener('pointermove', move);
          b.removeEventListener('pointerup', up);
          b.removeEventListener('pointercancel', up);
          if (!ghost) return;
          ghost.remove();
          b.classList.remove('drag');
          b.dataset.dragged = '1';
          setTimeout(function () { delete b.dataset.dragged; }, 0);
          state.dragging = false;
          if (!target) return;
          target.classList.remove('drop');
          var d = state.live;
          if (d.track_minutes && minuteVal() == null) {
            toast('Dakikayı yazın.', true);
            var mi = document.getElementById('lmin');
            if (mi) mi.focus();
            return;
          }
          addEvent({type: 'substitution', team: team, player: target.getAttribute('data-tk'), sub_in: pid});
        }
        b.addEventListener('pointermove', move);
        b.addEventListener('pointerup', up);
        b.addEventListener('pointercancel', up);
      });
    });
  }

  function evIcon(e) {
    if (e.type === 'goal') return e.own ? '🔄' : e.pen ? '🎯' : '⚽';
    if (e.type === 'goal_cancelled') return '📺';
    if (e.type === 'penalty_missed') return '✖️';
    if (e.type === 'yellow_card') return e.second ? '<i class="card2"></i>' : '<i class="card-ic" style="background:#facc15"></i>';
    if (e.type === 'red_card') return '<i class="card-ic" style="background:#ef4444"></i>';
    if (e.type === 'red_card_cancelled') return '<i class="card-ic" style="background:#ef4444;opacity:.4"></i>';
    if (e.type === 'substitution') return '↔️';
    if (e.type === 'man_of_the_match') return '⭐';
    return '•';
  }
  function evText(e, d) {
    var team = e.team_id === d.home_id ? d.home : d.away;
    var t = {
      goal: e.own ? 'Kendi kalesine' : e.pen ? 'Penaltı golü' : 'Gol',
      goal_cancelled: 'Gol (VAR ile iptal)',
      penalty_missed: 'Kaçan penaltı',
      yellow_card: e.second ? 'Çift sarıdan ihraç' : 'Sarı kart',
      red_card: 'Kırmızı kart',
      red_card_cancelled: 'Kırmızı kart (VAR ile iptal)',
      substitution: 'Değişiklik',
      man_of_the_match: 'Maçın adamı'
    }[e.type] || e.type;
    var who = e.type === 'substitution' ? (e.sub_in || '?') + ' ↔ ' + (e.player || '?') : (e.player || '');
    var extra = e.type === 'goal' && e.assist ? ' · Asist: ' + e.assist : '';
    return '<b>' + esc(who || t) + '</b><small>' + esc(t + extra + ' · ' + team) + '</small>';
  }
  function eventsHtml(d) {
    var ev = d.events.slice().reverse();
    if (!ev.length) return '<div class="empty">Henüz olay yok.</div>';
    var locked = isLocked();
    return ev.map(function (e) {
      var acts = '';
      if (locked) return evRow(e, d, '');
      if (e.type === 'goal' && d.status !== 'notStarted') acts += '<button class="btn ghost" data-var="' + e.id + '" title="VAR: gol iptali">VAR</button>';
      if (e.type === 'red_card') acts += '<button class="btn ghost" data-varr="' + e.id + '" title="VAR: kart iptali">VAR</button>';
      if (!/_cancelled$/.test(e.type)) acts += '<button class="btn ghost" data-edit="' + e.id + '" title="Oyuncu, asist ya da dakikayı düzelt">Düzenle</button>';
      acts += '<button class="btn ghost" data-del="' + e.id + '" title="Yanlış girildiyse sil">Sil</button>';
      return evRow(e, d, acts);
    }).join('');
  }
  function evRow(e, d, acts) {
    var cancelled = /_cancelled$/.test(e.type);
    return '<div class="ev' + (e.team_id === d.away_id ? ' away' : '') + (cancelled ? ' cancelled' : '') + '">' +
      '<span class="m num">' + minLabel(e.minute, e.added) + '</span>' +
      '<span>' + evIcon(e) + '</span><div class="tx">' + evText(e, d) + '</div><div class="acts">' + acts + '</div></div>';
  }

  function phaseHtml(d) {
    var b = [];
    var eq = d.hs === d.as;
    if (d.status === 'notStarted' || d.status === 'postponed') b.push(['start', 'Maçı başlat', 'live']);
    if (d.status === 'live' && !d.second_half_at) b.push(['end_first_half', 'İlk yarıyı bitir', 'primary']);
    if (d.status === 'halftime') b.push(['start_second_half', 'İkinci yarıyı başlat', 'live']);
    if (d.status === 'live' && d.second_half_at && !d.shootout) {
      if (d.tiebreak === 'et_pens' && eq && !d.extra_time_at) b.push(['start_extra_time', 'Uzatmaya geç', '']);
      if (d.tiebreak && eq) b.push(['start_shootout', 'Penaltılara geç', '']);
    }
    if (d.status === 'live' && d.second_half_at) b.push(['finish', 'Maçı bitir', 'primary']);
    var html = b.map(function (x) { return '<button class="btn ' + x[2] + '" data-phase="' + x[0] + '">' + x[1] + '</button>'; }).join('');
    if (d.owner && d.status !== 'notStarted' && d.status !== 'postponed' && d.status !== 'cancelled') {
      html += '<span class="grow"></span><button class="btn ghost" data-phase="undo" title="Son adımı geri al">Son adımı geri al</button>';
    }
    return html;
  }

  function shootHtml(d) {
    if (!(d.status === 'live' && d.shootout)) return '';
    var kicks = Array.isArray(d.shootout) ? d.shootout.length : 0;
    return '<div class="shoot"><span class="label warn">Penaltı atışları · ' + (d.hp || 0) + '–' + (d.ap || 0) + '</span>' +
      '<div class="grp"><b>' + esc(d.home) + '</b><button class="btn primary" data-kick="h1">Gol</button><button class="btn" data-kick="h0">Kaçtı</button></div>' +
      '<div class="grp"><b>' + esc(d.away) + '</b><button class="btn primary" data-kick="a1">Gol</button><button class="btn" data-kick="a0">Kaçtı</button></div>' +
      (kicks ? '<button class="btn ghost" data-kick="undo">Son atışı geri al</button>' : '') + '</div>';
  }

  // ---------- Maç yönetimi (tek yönetici + devir) ----------
  // Uygulamadaki MatchControlBar ile aynı kurallar (match_control_* RPC):
  // olay girişi, devreler, penaltılar ve skor yalnız yönetende açık;
  // gözlemci girince yönetim boşsa ona geçer; devir isteğine 30 sn cevap
  // gelmezse ya da yöneten 2 dk görünmezse onaysız devralınır. Bitmiş ve
  // iptal maçta kilit yok.
  var ctlTimer = null, ctlAuto = {};
  function needsControl(d) { return d && d.status !== 'finished' && d.status !== 'cancelled'; }
  function isLocked() {
    var d = state.live;
    return needsControl(d) && !(state.ctl && state.ctl.mine);
  }
  function applyCtl(c, id) {
    if (id !== state.liveId || !c) return;
    var was = state.ctl && state.ctl.match === id ? state.ctl.mine : null;
    c.match = id;
    var sig = JSON.stringify(c, function (k, v) { return k === 'now' || k === 'req_left' ? undefined : v; });
    var changed = sig !== state.ctlSig;
    state.ctl = c;
    state.ctlSig = sig;
    if (was === true && !c.mine) {
      state.mode = null;
      state.pick = null;
      toast('Maçın yönetimi ' + (c.controller_name || 'başka bir sorumluya') + ' geçti.');
    }
    if (!c.controller && c.observer && !ctlAuto[id]) {
      ctlAuto[id] = true;
      ctlCall('match_control_take');
    }
    if (c.mine && c.req_user && !state.ctlAsk) showCtlRequest(c);
    if (changed) renderDetail();
    else {
      var w = document.getElementById('ctlwait');
      if (w && c.req_left != null) w.textContent = c.req_left + ' sn';
    }
  }
  function loadCtl() {
    var id = state.liveId;
    if (!id || !state.live || !needsControl(state.live)) return Promise.resolve();
    return api('rpc/match_control_state', {method: 'POST', body: {p_match_id: id}})
      .then(function (c) { applyCtl(c, id); }, function () {});
  }
  function ctlCall(fn, extra) {
    var id = state.liveId;
    var body = {p_match_id: id};
    for (var k in extra || {}) body[k] = extra[k];
    return api('rpc/' + fn, {method: 'POST', body: body})
      .then(function (c) { applyCtl(c, id); }, function (e) { toast(e.message, true); });
  }
  function startCtlPoll() {
    clearInterval(ctlTimer);
    ctlTimer = setInterval(function () { if (!document.hidden) loadCtl(); }, 5000);
  }
  function ctlHtml(d) {
    var c = state.ctl;
    if (!needsControl(d)) return '';
    if (!c || c.match !== d.id) return '<div class="ctl free"><span class="tx"><b>Yönetim bilgisi yükleniyor…</b></span></div>';
    if (!c.controller) {
      return '<div class="ctl free"><span class="tx"><b>Maçı şu an kimse yönetmiyor</b><small>Olay girmek için yönetimi alın.</small></span>' +
        '<button class="btn primary" data-ctl="take">Maçı yönet</button></div>';
    }
    if (c.mine) {
      return '<div class="ctl mine"><span class="av">●</span><span class="tx"><b>Maçı sen yönetiyorsun</b><small>Olay girişi, devreler ve skor sende.</small></span>' +
        '<button class="btn ghost" data-ctl="release">Yönetimi bırak</button></div>';
    }
    if (c.req_mine) {
      return '<div class="ctl wait"><span class="av">…</span><span class="tx"><b>' + esc(c.controller_name) + ' onayı bekleniyor</b><small>Devir isteği gönderildi · <span id="ctlwait">' + (c.req_left || 0) + ' sn</span></small></span>' +
        '<button class="btn ghost" data-ctl="cancel">İsteği geri çek</button></div>';
    }
    return '<div class="ctl other"><span class="av">🔒</span><span class="tx"><b>Maçı ' + esc(c.controller_name) + ' yönetiyor</b><small>' +
      (c.online ? '<i class="on"></i>Çevrimiçi · giriş düğmeleri yalnız onda açık' : '<i class="off"></i>2 dakikadır görünmüyor') + '</small></span>' +
      (c.can_force
        ? '<button class="btn primary" data-ctl="take">Yönetimi devral (onay gerekmiyor)</button>'
        : '<button class="btn info" data-ctl="request">Yönetimi devral</button>') + '</div>';
  }
  function bindCtl(el) {
    Array.prototype.forEach.call(el.querySelectorAll('[data-ctl]'), function (b) {
      b.onclick = function () {
        b.disabled = true;
        ctlCall({take: 'match_control_take', release: 'match_control_release', cancel: 'match_control_cancel', request: 'match_control_request'}[b.getAttribute('data-ctl')]);
      };
    });
  }
  // Yönetenin ekranında devir isteği (30 sn geri sayım).
  function showCtlRequest(c) {
    if (state.dlg) return;
    state.ctlAsk = true;
    var left = c.req_left || 30;
    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h3>' + esc(c.req_name) + ' yönetimi devralmak istiyor</h3>' +
      '<div class="sub">Onaylarsan olay girişi ' + esc(c.req_name) + '\'e geçer; sen maçı izlemeye devam edersin. Cevap vermezsen süre dolunca onaysız devralabilir.</div>' +
      '<div class="cbar"><i id="cbar" style="width:' + (left / 30 * 100) + '%"></i></div>' +
      '<div class="acts"><span class="hint"><span class="kbd">Enter</span> onayla · <span class="kbd">Esc</span> reddet</span>' +
      '<button class="btn" data-n>Reddet</button><button class="btn primary" data-y>Onayla, devret</button></div></div>';
    document.body.appendChild(ov);
    state.dlg = ov;
    var t = setInterval(function () {
      left--;
      var b = document.getElementById('cbar');
      if (b) b.style.width = Math.max(0, left / 30 * 100) + '%';
      if (left <= 0) done(null);
    }, 1000);
    function done(v) {
      clearInterval(t);
      ov.remove();
      state.dlg = null;
      state.ctlAsk = false;
      if (v !== null) ctlCall('match_control_answer', {p_approve: v});
    }
    ov.querySelector('[data-n]').onclick = function () { done(false); };
    ov.querySelector('[data-y]').onclick = function () { done(true); };
    ov.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
      else if (e.key === 'Enter') { e.preventDefault(); done(true); }
    });
    ov.querySelector('[data-y]').focus();
  }

  function renderDetail() {
    var el = document.getElementById('detail');
    if (!el) return;
    if (!state.liveId) { el.innerHTML = ''; return; }
    var d = state.live;
    if (!d || d.id !== state.liveId) {
      el.innerHTML = '<div class="box"><div class="empty" style="border:0">Yükleniyor…</div></div>';
      loadLive();
      return;
    }
    var keepScroll = el.scrollTop;
    var locked = isLocked();
    if (locked) { state.mode = null; state.pick = null; state.menu = null; }
    var pv = canPitch(d);
    if (!pv) state.menu = null;
    var finished = d.status === 'finished';
    var started = d.status !== 'notStarted' && d.status !== 'postponed';
    var mk = marks(d);
    var mode = state.mode;
    var hint;
    if (state.pick && state.pick.step === 'assist') {
      hint = '<div class="hintbar">⚽ ' + esc(state.pick.name) + ' · asist yapan oyuncuyu seçin<button class="btn primary" id="noassist">Asistsiz kaydet <span class="kbd">Enter</span></button><button class="btn ghost" id="cancelpick">Vazgeç <span class="kbd">Esc</span></button></div>';
    } else if (state.pick && state.pick.step === 'in') {
      hint = '<div class="hintbar">↔️ Çıkan: ' + esc(state.pick.name) + ' · giren oyuncuyu seçin (kenardakiler)<button class="btn ghost" id="cancelpick">Vazgeç <span class="kbd">Esc</span></button></div>';
    } else if (mode) {
      hint = '<div class="hintbar">' + esc(MODE_HINT[mode]) + '<button class="btn ghost" id="cancelpick">Vazgeç <span class="kbd">Esc</span></button></div>';
    } else if (locked) {
      hint = '<div class="hintbar idle">Olay girişi, devreler ve skor yalnız maçı yöneten kişide açık.</div>';
    } else if (canPitch(d)) {
      hint = '<div class="hintbar idle">Oyuncuya tıklayın ya da üstüne gelip harfe basın (G, S, R…). Değişiklik: yedeği sahadaki oyuncunun üstüne sürükleyin.' +
        (started ? '' : ' Maç başlamadan da olay girilebilir; dakikayı elle yazın.') + '</div>';
    } else {
      hint = '<div class="hintbar idle">Olay türünü seçin (harf tuşu ya da düğme), sonra oyuncuya tıklayın.' +
        (started ? '' : ' Maç başlamadan da olay girilebilir; dakikayı elle yazın.') + '</div>';
    }
    var tools = MODES.map(function (x) {
      var dis = locked || (x.id === 'motm' && !finished);
      return '<button class="tool" data-mode="' + x.id + '" aria-pressed="' + (mode === x.id) + '"' + (dis ? ' disabled title="Maç bittikten sonra"' : '') + '>' +
        x.icon + ' ' + esc(x.name) + ' <span class="kbd">' + x.key + '</span></button>';
    }).join('');
    var minute = d.track_minutes
      ? '<label class="minute" title="Uzatma için 45+2 yazın">Dakika <input id="lmin" class="num" maxlength="6" value="' + partsText(minParts(d)) + '"> <span class="kbd">M</span></label>'
      : '<span class="minute">Bu sezonda dakika tutulmuyor</span>';
    function side(name, logo, r) {
      return '<div class="side-t' + (r ? ' r' : '') + '">' + (r ? '<span>' + esc(name) + '</span>' : '') +
        (logo ? '<img src="' + esc(logo) + '" alt="">' : '<span class="dot">' + esc(initials(name)) + '</span>') +
        (r ? '' : '<span>' + esc(name) + '</span>') + '</div>';
    }
    var meta = [state.league ? '' : d.league, d.cup_round || (d.week ? d.week + '. hafta' : ''), shortDate(d.date) + ' ' + (d.time || '').slice(0, 5)].filter(Boolean).join(' · ');
    el.innerHTML =
      '<section class="board">' +
      '<div class="dhead"><span class="sub">' + esc(meta) + '</span>' +
      '<button class="btn ghost fixture-toggle" id="fixtureToggle" aria-expanded="' + (!state.fixturesHidden) + '">' + (state.fixturesHidden ? 'Fikstürü göster' : 'Fikstürü gizle') + '</button>' +
      (d.roster.some(function (r) { return r.starting; }) ? '<button class="btn ghost" id="lview">' + (state.pitchView ? 'Liste görünümü' : 'Saha görünümü') + '</button>' : '') +
      '<button class="btn ghost" id="lref">Yenile</button><button class="btn ghost" id="lclose" title="Kapat (Esc)">✕ Kapat</button></div>' +
      '<div class="sb">' + side(d.home, d.home_logo, true) +
      '<div class="mid"><div class="score num">' + (d.hs || 0) + ' – ' + (d.as || 0) + '</div>' +
      '<div class="clock">' + clockText(d) + (d.hp != null && d.ap != null ? '<span class="pens-s">Pen. ' + d.hp + '–' + d.ap + '</span>' : '') + '</div></div>' +
      side(d.away, d.away_logo, false) + '</div>' +
      (locked ? '' : '<div class="phase">' + phaseHtml(d) + '</div>' + shootHtml(d)) +
      '</section>' + ctlHtml(d) +
      '<div class="tools">' + tools + minute + '</div>' + hint +
      (pv
        ? '<div class="pitchgrid">' + benchHtml(d, d.home_id, mk, true) + pitchHtml(d, mk) + benchHtml(d, d.away_id, mk, false) + '</div>' +
          '<section class="box evbox evfull"><div class="box-head"><h2 class="label">Olaylar</h2><span class="hint">' + d.events.length + '</span></div><div class="evs">' + eventsHtml(d) + '</div></section>'
        : '<div class="lgrid' + (mode ? ' armed' : '') + '">' +
          '<section class="box"><div class="box-head"><h2 class="label">' + esc(d.home) + '</h2><button class="btn ghost roster-edit" data-roster-edit data-team="' + esc(d.home_id) + '">Esameyi düzenle</button></div>' + rosterHtml(d, d.home_id, mk) + '</section>' +
          '<section class="box evbox"><div class="box-head"><h2 class="label">Olaylar</h2><span class="hint">' + d.events.length + '</span></div><div class="evs">' + eventsHtml(d) + '</div></section>' +
          '<section class="box"><div class="box-head"><h2 class="label">' + esc(d.away) + '</h2><button class="btn ghost roster-edit" data-roster-edit data-team="' + esc(d.away_id) + '">Esameyi düzenle</button></div>' + rosterHtml(d, d.away_id, mk) + '</section>' +
          '</div>') +
      '<div class="keys"><span><span class="kbd">G</span> gol</span><span><span class="kbd">P</span> penaltı</span><span><span class="kbd">O</span> kendi kalesine</span><span><span class="kbd">S</span> sarı</span><span><span class="kbd">R</span> kırmızı</span><span><span class="kbd">D</span> değişiklik</span><span><span class="kbd">M</span> dakika</span><span><span class="kbd">Esc</span> vazgeç / kapat</span>' +
      (pv ? '<span>· Oyuncunun üstüne gel + harf = tek tuşla olay · yedeği sürükle-bırak = değişiklik</span>' : '') + '</div>';
    el.scrollTop = keepScroll;
    bindCtl(el);

    document.getElementById('lclose').onclick = closeLive;
    var ft = document.getElementById('fixtureToggle');
    if (ft) ft.onclick = function () {
      state.fixturesHidden = !state.fixturesHidden;
      var split = document.getElementById('split');
      if (split) split.classList.toggle('fixtures-hidden', state.fixturesHidden);
      ft.textContent = state.fixturesHidden ? 'Fikstürü göster' : 'Fikstürü gizle';
      ft.setAttribute('aria-expanded', String(!state.fixturesHidden));
    };
    var lv = document.getElementById('lview');
    if (lv) lv.onclick = function () {
      state.pitchView = !state.pitchView;
      state.menu = null;
      try { localStorage.setItem(PKEY, state.pitchView ? '1' : '0'); } catch (e) {}
      renderDetail();
    };
    document.getElementById('lref').onclick = function () { loadLive(); };
    var mi = document.getElementById('lmin');
    if (mi) {
      mi.addEventListener('input', function () { mi.value = cleanMin(mi.value); state.minuteManual = true; });
      mi.addEventListener('focus', function () { mi.select(); });
      mi.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); mi.blur(); } });
    }
    var np = document.getElementById('noassist');
    if (np) np.onclick = function () { finishGoal(null); };
    var cp = document.getElementById('cancelpick');
    if (cp) cp.onclick = cancelPick;
    function each(sel, fn) { Array.prototype.forEach.call(el.querySelectorAll(sel), fn); }
    each('[data-mode]', function (b) { b.onclick = function () { setMode(b.getAttribute('data-mode')); }; });
    each('[data-roster-edit]', function (b) {
      // Maçı başkası yönetirken esame de değiştirilemez.
      if (locked) { b.disabled = true; b.title = 'Esame yalnız maçı yöneten kişide düzenlenebilir'; return; }
      // Düdükten sonra esame kapanır; admin ve kurucu başkan yalnız yedek ekler.
      if (d.kickoff_at && !d.owner) { b.disabled = true; b.title = 'Maç başladı; esame kapandı'; return; }
      b.onclick = function () { editRoster(b.getAttribute('data-team')); };
    });
    each('[data-pl]', function (b) { b.onclick = function () { pickPlayer(b.getAttribute('data-pl'), b.getAttribute('data-team')); }; });
    each('[data-tk]', function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-tk'), tm = b.getAttribute('data-team');
        if (state.mode || state.pick) return pickPlayer(id, tm);
        if (state.menu && state.menu.pid === id) { closeMenu(); return; }
        openMenu(id, tm);
      };
    });
    each('[data-bp]', function (b) {
      b.onclick = function () {
        if (b.dataset.dragged) return;
        if (state.mode || state.pick) return pickPlayer(b.getAttribute('data-bp'), b.getAttribute('data-team'));
        toast('Değişiklik için yedeği sahadaki oyuncunun üstüne sürükleyin.');
      };
    });
    if (pv) { bindDrag(el); drawMenu(); }
    each('[data-phase]', function (b) { b.onclick = function () { phase(b.getAttribute('data-phase'), b); }; });
    each('[data-kick]', function (b) { b.onclick = function () { kick(b.getAttribute('data-kick'), b); }; });
    each('[data-del]', function (b) { b.onclick = function () { delEvent(b.getAttribute('data-del')); }; });
    each('[data-edit]', function (b) { b.onclick = function () { editEvent(b.getAttribute('data-edit')); }; });
    each('[data-var]', function (b) { b.onclick = function () { varGoal(b.getAttribute('data-var')); }; });
    each('[data-varr]', function (b) { b.onclick = function () { varRed(b.getAttribute('data-varr')); }; });
  }

  function setMode(id) {
    if (id === 'motm' && !(state.live && state.live.status === 'finished')) return;
    state.pick = null;
    state.menu = null;
    state.mode = state.mode === id ? null : id;
    renderDetail();
  }
  function cancelPick() {
    state.pick = null;
    state.mode = null;
    renderDetail();
  }
  // Dakika alanı: yalnız rakam ve bir '+' (45+2).
  function cleanMin(v) {
    v = String(v).replace(/[^0-9+]/g, '');
    var i = v.indexOf('+');
    return i < 0 ? v : v.slice(0, i + 1) + v.slice(i + 1).replace(/\+/g, '');
  }
  function parseMin(v) {
    var p = cleanMin(v).split('+');
    var m = parseInt(p[0], 10), a = parseInt(p[1], 10);
    if (isNaN(m)) return null;
    return {minute: m, added: isNaN(a) || a <= 0 ? null : Math.min(30, a)};
  }
  function minuteVal() {
    var d = state.live;
    if (!d.track_minutes) return null;
    var mi = document.getElementById('lmin');
    return mi ? parseMin(mi.value) : null;
  }
  function nameOf(pid) {
    var r = state.live.roster.filter(function (x) { return x.player_id === pid; })[0];
    return r ? r.name : '';
  }

  function pickPlayer(pid, teamId) {
    var d = state.live, mode = state.mode, pk = state.pick;
    if (!mode) { toast('Önce olay türünü seçin (G, S, R, D…).', true); return; }
    if (d.track_minutes && mode !== 'motm' && minuteVal() == null) {
      toast('Dakikayı yazın.', true);
      document.getElementById('lmin').focus();
      return;
    }
    if (pk && pk.step === 'assist') {
      if (pid === pk.player) return;
      return finishGoal(pid);
    }
    if (pk && pk.step === 'in') {
      if (pid === pk.player) return;
      return addEvent({type: 'substitution', team: pk.team, player: pk.player, sub_in: pid});
    }
    if (mode === 'goal') {
      state.pick = {step: 'assist', player: pid, team: teamId, name: nameOf(pid), minute: minuteVal()};
      return renderDetail();
    }
    if (mode === 'sub') {
      state.pick = {step: 'in', player: pid, team: teamId, name: nameOf(pid)};
      return renderDetail();
    }
    var map = {
      pen_goal: {type: 'goal', pen: true},
      own_goal: {type: 'goal', own: true},
      pen_miss: {type: 'penalty_missed'},
      yellow: {type: 'yellow_card'},
      red: {type: 'red_card'},
      motm: {type: 'man_of_the_match'}
    }[mode];
    addEvent({type: map.type, team: teamId, player: pid, pen: !!map.pen, own: !!map.own});
  }
  function finishGoal(assistId) {
    var pk = state.pick;
    if (!pk || pk.step !== 'assist') return;
    addEvent({type: 'goal', team: pk.team, player: pk.player, assist: assistId, minute: pk.minute});
  }

  function addEvent(o) {
    var d = state.live;
    var body = {
      p_match_id: d.id, p_type: o.type, p_team_id: o.team, p_player_id: o.player,
      p_minute: null, p_added: null,
      p_assist_id: o.assist || null, p_sub_in_id: o.sub_in || null,
      p_own_goal: !!o.own, p_penalty: !!o.pen
    };
    var mv = o.minute !== undefined ? o.minute : minuteVal();
    if (mv) { body.p_minute = mv.minute; body.p_added = mv.added; }
    state.pick = null;
    state.mode = null;
    state.minuteManual = false;
    renderDetail();
    return api('rpc/desk_add_event', {method: 'POST', body: body}).then(function () {
      var label = {goal: o.own ? 'Kendi kalesine gol' : 'Gol', penalty_missed: 'Kaçan penaltı', yellow_card: 'Sarı kart', red_card: 'Kırmızı kart', substitution: 'Değişiklik', man_of_the_match: 'Maçın adamı'}[o.type];
      toast(label + ' kaydedildi: ' + nameOf(o.player));
      return loadLive();
    }, function (e) { toast(e.message, true); });
  }

  function confirmBox(title, text, okLabel, danger) {
    return new Promise(function (resolve) {
      var ov = document.createElement('div');
      ov.className = 'ov';
      ov.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3><div class="sub">' + esc(text) + '</div>' +
        '<div class="acts"><span class="hint"><span class="kbd">Enter</span> onayla · <span class="kbd">Esc</span> vazgeç</span>' +
        '<button class="btn" data-n>Vazgeç</button><button class="btn ' + (danger ? 'live' : 'primary') + '" data-y>' + esc(okLabel) + '</button></div></div>';
      document.body.appendChild(ov);
      state.dlg = ov;
      function done(v) { ov.remove(); state.dlg = null; resolve(v); }
      ov.querySelector('[data-n]').onclick = function () { done(false); };
      ov.querySelector('[data-y]').onclick = function () { done(true); };
      ov.onclick = function (e) { if (e.target === ov) done(false); };
      ov.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); done(false); }
        else if (e.key === 'Enter') { e.preventDefault(); done(true); }
      });
      ov.querySelector('[data-y]').focus();
    });
  }

  function phase(action, btn) {
    var ask = {
      finish: ['Maçı bitir', 'Maç bitmiş sayılır; sonuç puan tablosuna işlenir ve takipçilere bildirim gider.', 'Maçı bitir', false],
      undo: ['Son adımı geri al', 'Maçın son durumu bir adım geri alınır (ör. bitmiş maç yeniden canlıya döner).', 'Geri al', true],
      start_shootout: ['Penaltılara geç', 'Penaltı atışları başlar.', 'Penaltılara geç', false],
      start_extra_time: ['Uzatmaya geç', 'Uzatma devresi başlar.', 'Uzatmaya geç', false]
    }[action];
    // Geri al: önce ne geri alınacağı sorulur (son olay ya da aşama).
    var go2 = action === 'undo'
      ? api('rpc/match_undo_preview', {method: 'POST', body: {p_match_id: state.live.id}}).then(function (pv) {
          if (pv.kind === 'event') return confirmBox('Son olayı geri al', pv.label + ' silinecek. Maç saati ve durumu değişmez.', 'Geri al', false);
          return confirmBox(pv.resets_clock ? 'Maç saati sıfırlanacak' : 'Son adımı geri al',
            pv.label + (pv.resets_clock ? '. Emin misiniz?' : '.'), 'Geri al', true);
        }, function (e) { toast(e.message, true); return false; })
      : ask ? confirmBox(ask[0], ask[1], ask[2], ask[3]) : Promise.resolve(true);
    go2.then(function (ok) {
      if (!ok) return;
      btn.disabled = true;
      api('rpc/advance_match_phase', {method: 'POST', body: {p_match_id: state.live.id, p_action: action}}).then(function () {
        state.minuteManual = false;
        return loadLive();
      }, function (e) {
        btn.disabled = false;
        toast(e.message, true);
      });
    });
  }

  function kick(k, btn) {
    btn.disabled = true;
    var body = {p_match_id: state.live.id, p_side: k === 'undo' ? null : k[0], p_scored: k[1] === '1'};
    api('rpc/shootout_kick', {method: 'POST', body: body}).then(loadLive, function (e) {
      btn.disabled = false;
      toast(e.message, true);
    });
  }

  function evById(id) { return state.live.events.filter(function (e) { return e.id === id; })[0]; }
  function delEvent(id) {
    var e = evById(id);
    confirmBox('Olayı sil', (e ? (minLabel(e.minute, e.added) ? minLabel(e.minute, e.added) + ' ' : '') + (e.player || '') : '') + ' kaydı silinecek. Yanlış girilen olaylar için kullanın; VAR kararı için VAR düğmesini kullanın.', 'Sil', true).then(function (ok) {
      if (!ok) return;
      api('rpc/desk_delete_event', {method: 'POST', body: {p_event_id: id}}).then(function () {
        toast('Olay silindi.');
        return loadLive();
      }, function (err) { toast(err.message, true); });
    });
  }
  // Olayı düzenle (uygulamadaki uzun basış DÜZENLE gibi): oyuncu, asist,
  // giren oyuncu ve dakika. Takım ve olay türü değişmez; skor etkilenmez.
  function editEvent(id) {
    var d = state.live, e = evById(id);
    if (!e || state.dlg) return;
    var team = d.roster.filter(function (r) { return r.team_id === e.team_id; });
    function opts(sel, none) {
      return (none ? '<option value="">' + esc(none) + '</option>' : '') + team.map(function (r) {
        return '<option value="' + esc(r.player_id) + '"' + (r.player_id === sel ? ' selected' : '') + '>' +
          (r.no == null ? '' : r.no + ' · ') + esc(r.name) + '</option>';
      }).join('');
    }
    var isGoal = e.type === 'goal' && !e.own;
    var isSub = e.type === 'substitution';
    var hasMin = d.track_minutes && e.type !== 'man_of_the_match';
    var title = {goal: e.own ? 'Kendi kalesine gol' : e.pen ? 'Penaltı golü' : 'Gol', penalty_missed: 'Kaçan penaltı', yellow_card: 'Sarı kart', red_card: 'Kırmızı kart', substitution: 'Değişiklik', man_of_the_match: 'Maçın adamı'}[e.type] || 'Olay';
    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h3>Olayı düzenle</h3>' +
      '<div class="sub">' + esc(title + ' · ' + (e.team_id === d.home_id ? d.home : d.away)) + '</div>' +
      '<div class="form"><label>' + (isSub ? 'Çıkan oyuncu' : 'Oyuncu') + '<select id="ep" class="sel">' + opts(e.player_id) + '</select></label>' +
      (isSub ? '<label>Giren oyuncu<select id="ei" class="sel">' + opts(e.sub_in_id) + '</select></label>' : '') +
      (isGoal ? '<label>Asist<select id="ea" class="sel">' + opts(e.assist_id, 'Asist yok') + '</select></label>' : '') +
      (hasMin ? '<label>Dakika (uzatma için 45+2)<input id="em" class="inp num" maxlength="6" value="' + esc(e.minute == null ? '' : e.minute + (e.added ? '+' + e.added : '')) + '"></label>' : '') +
      '</div><div class="acts"><span class="hint"><span class="kbd">Enter</span> kaydet · <span class="kbd">Esc</span> vazgeç</span>' +
      '<button class="btn" data-n>Vazgeç</button><button class="btn primary" data-y>Kaydet</button></div></div>';
    document.body.appendChild(ov);
    state.dlg = ov;
    function close() { ov.remove(); state.dlg = null; }
    var em = ov.querySelector('#em');
    if (em) em.addEventListener('input', function () { em.value = cleanMin(em.value); });
    function save() {
      var body = {player_id: ov.querySelector('#ep').value};
      if (isSub) {
        body.sub_in_player_id = ov.querySelector('#ei').value;
        if (body.sub_in_player_id === body.player_id) { toast('Giren ve çıkan aynı oyuncu olamaz.', true); return; }
      }
      if (isGoal) {
        body.assist_player_id = ov.querySelector('#ea').value || null;
        if (body.assist_player_id === body.player_id) { toast('Golü atan asist yapamaz.', true); return; }
      }
      if (hasMin) {
        var mv = parseMin(em.value);
        if (!mv) { toast('Dakikayı yazın.', true); em.focus(); return; }
        body.minute = mv.minute;
        body.added_minute = mv.added;
      }
      var btn = ov.querySelector('[data-y]');
      btn.disabled = true;
      api('match_events?id=eq.' + id + '&select=id', {method: 'PATCH', body: body, prefer: 'return=representation'}).then(function (r) {
        if (!r || !r.length) throw new Error('Olay güncellenemedi: bu maçı düzenleme yetkiniz yok.');
        close();
        toast('Olay güncellendi.');
        return loadLive();
      }).catch(function (err) { btn.disabled = false; toast(err.message, true); });
    }
    ov.querySelector('[data-n]').onclick = close;
    ov.querySelector('[data-y]').onclick = save;
    ov.onclick = function (ev) { if (ev.target === ov) close(); };
    ov.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); close(); }
      else if (ev.key === 'Enter' && ev.target.tagName !== 'SELECT') { ev.preventDefault(); save(); }
    });
    (em || ov.querySelector('#ep')).focus();
  }

  // VAR: uygulamadaki gibi olay türü değişir; skor ve bildirim tetikleyicide.
  function varGoal(id) {
    var e = evById(id);
    confirmBox('VAR: Gol İptali', (e && e.player ? e.player + ' golü' : 'Bu gol') + ' iptal edilecek. Skor güncellenir ve maçı takip edenlere bildirim gider.', 'Golü iptal et', true).then(function (ok) {
      if (!ok) return;
      api('match_events?id=eq.' + id + '&event_type=eq.goal&select=id', {method: 'PATCH', body: {event_type: 'goal_cancelled'}, prefer: 'return=representation'}).then(function (r) {
        if (!r || !r.length) throw new Error('Gol güncellenemedi (yetki yok ya da zaten değişmiş).');
        toast('Gol VAR kararıyla iptal edildi.');
        return loadLive();
      }).catch(function (err) { toast(err.message, true); });
    });
  }
  function varRed(id) {
    var e = evById(id);
    confirmBox('VAR: Kart İptali', (e && e.player ? e.player + ' için ' : '') + 'kırmızı kart iptal edilecek; karttan doğan ceza da düşer.', 'Kartı iptal et', true).then(function (ok) {
      if (!ok) return;
      api('match_events?id=eq.' + id + '&event_type=eq.red_card&select=id', {method: 'PATCH', body: {event_type: 'red_card_cancelled'}, prefer: 'return=representation'}).then(function (r) {
        if (!r || !r.length) throw new Error('Kart güncellenemedi (yetki yok ya da zaten değişmiş).');
        return api('player_penalties?source_event_id=eq.' + id, {method: 'DELETE'}).catch(function () {});
      }).then(function () {
        toast('Kırmızı kart VAR kararıyla iptal edildi.');
        return loadLive();
      }).catch(function (err) { toast(err.message, true); });
    });
  }

  // Sağda maç açıkken harf tuşları olay türünü seçer; Esc önce yarım kalan
  // seçimi, sonra maçı kapatır.
  function liveKey(e) {
    if (!state.liveId || !state.live || state.dlg) return false;
    var k = e.key.length === 1 ? e.key.toLocaleUpperCase('tr') : e.key;
    if (k === 'Escape') {
      e.preventDefault();
      if (state.menu) { closeMenu(); return true; }
      if (state.mode || state.pick) cancelPick();
      else closeLive();
      return true;
    }
    if (isLocked()) return false;
    if (k === 'Enter' && state.pick && state.pick.step === 'assist') { e.preventDefault(); finishGoal(null); return true; }
    if (k === 'M') {
      var mi = document.getElementById('lmin');
      if (mi) { e.preventDefault(); mi.focus(); }
      return true;
    }
    // Saha görünümünde: menü açık oyuncu ya da farenin üstünde durduğu
    // oyuncu için harf tuşu olayı doğrudan girer.
    var tgt = null;
    if (!state.mode && !state.pick) {
      if (state.menu) tgt = state.menu;
      else {
        var hv = document.querySelector('#pitch [data-tk]:hover');
        if (hv && !hv.disabled) tgt = {pid: hv.getAttribute('data-tk'), team: hv.getAttribute('data-team')};
      }
    }
    for (var i = 0; i < MODES.length; i++) {
      if (MODES[i].key !== k) continue;
      e.preventDefault();
      if (tgt) {
        if (MODES[i].id === 'motm' && state.live.status !== 'finished') return true;
        quickEvent(MODES[i].id, tgt.pid, tgt.team);
      } else setMode(MODES[i].id);
      return true;
    }
    return false;
  }

  // ---------- Onaylar ----------
  // Uygulamadaki "Bekleyen Onaylar" ile aynı talepler ve aynı karar
  // RPC'leri. Kartlar arasında ↑ ↓, O onayla, X reddet.
  var APPR_TYPES = {roster_add: 'Kadroya ekleme', roster_remove: 'Kadrodan çıkarma', jersey_change: 'Forma numarası'};
  var PROFILE_LABEL = {photo_url: 'Fotoğraf', height: 'Boy', weight: 'Kilo', main_position: 'Mevki', sub_position: 'Alt mevki', birth_date: 'Doğum tarihi'};
  var apprTimer = null;

  function loadApprovals() {
    return api('rpc/desk_approvals', {method: 'POST', body: {}}).then(function (j) {
      state.appr = j;
      updateApprCount();
      if (state.view === 'approvals') renderContent();
    }, function (e) { if (state.view === 'approvals') toast(e.message, true); });
  }
  function apprItems() {
    var a = state.appr;
    if (!a) return [];
    var lg = state.league;
    function inLeague(x) { return !lg || !x.league_id || x.league_id === lg; }
    var out = [];
    a.roster.filter(inLeague).forEach(function (x) { out.push({kind: 'roster', x: x}); });
    a.penalties.filter(inLeague).forEach(function (x) { out.push({kind: 'penalty', x: x}); });
    a.profile.forEach(function (x) { out.push({kind: 'profile', x: x}); });
    a.conflicts.filter(inLeague).forEach(function (x) { out.push({kind: 'conflict', x: x}); });
    a.instagram.filter(inLeague).forEach(function (x) { out.push({kind: 'instagram', x: x}); });
    return out;
  }
  // Menüdeki sayı (taslaktaki sarı rozet); 60 sn'de bir tazelenir.
  function updateApprCount() {
    var n = apprItems().length;
    var b = root.querySelector('.nav-btn[data-view="approvals"]');
    if (!b) return;
    var c = b.querySelector('.count');
    if (!n) { if (c) c.remove(); return; }
    if (!c) { c = document.createElement('span'); c.className = 'count'; b.appendChild(c); }
    c.textContent = n;
  }
  function startApprPoll() {
    clearInterval(apprTimer);
    loadApprovals();
    apprTimer = setInterval(function () { if (!document.hidden && session) loadApprovals(); }, 60000);
  }

  function ago(t) {
    var s = Math.max(0, (Date.now() - Date.parse(t)) / 1000);
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' dk önce';
    if (s < 86400) return Math.round(s / 3600) + ' saat önce';
    return Math.round(s / 86400) + ' gün önce';
  }
  function profVal(k, v) {
    if (v == null || v === '') return '–';
    if (k === 'height') return v + ' cm';
    if (k === 'weight') return v + ' kg';
    if (k === 'birth_date') { var p = String(v).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : v; }
    return String(v);
  }
  function ytLink(id, title) {
    if (!id) return '<span class="sub">–</span>';
    return '<a href="https://www.youtube.com/watch?v=' + esc(id) + '" target="_blank" rel="noopener">' + esc(title || id) + '</a>';
  }

  function apprCard(it, i) {
    var x = it.x, head, body = '', acts;
    var sel = i === state.apprSel ? ' sel' : '';
    if (it.kind === 'roster') {
      head = '<span class="pill info">Kadro</span> ' + esc(APPR_TYPES[x.type] || x.type);
      body = '<p class="t">' + esc(x.player || '–') + (x.new_player ? ' <span class="pill mute">yeni oyuncu</span>' : '') +
        (x.type === 'jersey_change' && x.jersey ? ' → ' + esc(x.jersey) + ' numara' : (x.jersey ? ' · ' + esc(x.jersey) + ' numara' : '')) + '</p>' +
        '<p class="sub">' + esc([x.team, x.season, x.by ? 'Gönderen: ' + x.by : '', ago(x.created_at)].filter(Boolean).join(' · ')) + '</p>';
      acts = '<button class="btn primary" data-ok="' + i + '">Onayla <span class="kbd">O</span></button><button class="btn" data-no="' + i + '">Reddet <span class="kbd">X</span></button>';
    } else if (it.kind === 'penalty') {
      head = '<span class="pill warn">Ceza</span> ' + (x.kind === 'second_yellow' ? 'İkinci sarı kart' : 'Kırmızı kart');
      body = '<p class="t">' + esc(x.player || '–') + '</p><p class="sub">' + esc([x.team, x.match, ago(x.created_at)].filter(Boolean).join(' · ')) + '</p>' +
        '<label class="pen-n">Ceza <input class="num" inputmode="numeric" maxlength="2" value="' + esc(x.match_count || 1) + '" data-cnt="' + i + '"> maç</label>';
      acts = '<button class="btn primary" data-ok="' + i + '">Onayla <span class="kbd">O</span></button><button class="btn" data-no="' + i + '">Reddet <span class="kbd">X</span></button>';
    } else if (it.kind === 'profile') {
      head = '<span class="pill ok">Profil</span> Profil değişikliği';
      var ch = x.changes || {}, pr = x.previous || {};
      body = '<p class="t">' + esc(x.player || '–') + '</p><p class="sub">' + esc([x.team, ago(x.created_at)].filter(Boolean).join(' · ')) + '</p>' +
        '<div class="chg">' + Object.keys(ch).map(function (k) {
          if (k === 'photo_url') {
            return '<div><b>Fotoğraf</b> ' + (pr[k] ? '<img src="' + esc(pr[k]) + '" alt="">' : '–') + ' → ' + (ch[k] ? '<img src="' + esc(ch[k]) + '" alt="">' : '–') + '</div>';
          }
          return '<div><b>' + esc(PROFILE_LABEL[k] || k) + '</b> ' + esc(profVal(k, pr[k])) + ' → ' + esc(profVal(k, ch[k])) + '</div>';
        }).join('') + '</div>';
      acts = '<button class="btn primary" data-ok="' + i + '">Onayla <span class="kbd">O</span></button><button class="btn" data-no="' + i + '">Reddet <span class="kbd">X</span></button>';
    } else if (it.kind === 'conflict') {
      head = '<span class="pill live">Yayın</span> Yayın linki uyuşmazlığı';
      body = '<p class="t">' + esc(x.match) + '</p>' +
        '<div class="chg"><div><b>Elle girilen</b> ' + ytLink(x.manual_video, x.manual_title) + '</div><div><b>Kanalda bulunan</b> ' + ytLink(x.auto_video, x.auto_title) + '</div></div>';
      acts = '<button class="btn primary" data-ok="' + i + '">Kanaldakini kullan <span class="kbd">O</span></button><button class="btn" data-no="' + i + '">Elle gireni koru <span class="kbd">X</span></button>';
    } else {
      head = '<span class="pill mute">Instagram</span> Haberlere alınsın mı?';
      body = '<div class="ig">' + (x.image ? '<img src="' + esc(x.image) + '" alt="">' : '') +
        '<div><p class="t clamp">' + esc(x.content || '') + '</p><p class="sub">' + esc([x.league, ago(x.created_at)].filter(Boolean).join(' · ')) + '</p></div></div>';
      acts = '<button class="btn primary" data-ok="' + i + '">Haberlere al <span class="kbd">O</span></button><button class="btn" data-no="' + i + '">Alma <span class="kbd">X</span></button>';
    }
    return '<div class="appr2' + sel + '" data-ai="' + i + '"><div class="ah">' + head + '</div>' + body + '<div class="acts">' + acts + '</div></div>';
  }

  function renderApprovals(el) {
    if (!state.appr) {
      el.innerHTML = '<div class="h-row"><div><h1>Onaylar</h1></div></div><div class="box"><div class="empty" style="border:0">Yükleniyor…</div></div>';
      loadApprovals();
      return;
    }
    var items = apprItems();
    if (state.apprSel >= items.length) state.apprSel = items.length - 1;
    var groups = [['roster', 'Kadro talepleri'], ['penalty', 'Ceza onayları'], ['profile', 'Profil değişiklikleri'], ['conflict', 'Yayın linki uyuşmazlıkları'], ['instagram', 'Instagram gönderileri']];
    var html = '';
    groups.forEach(function (g) {
      var idx = [];
      items.forEach(function (it, i) { if (it.kind === g[0]) idx.push(i); });
      if (!idx.length) return;
      html += '<section class="box"><div class="box-head"><h2 class="label">' + g[1] + '</h2><span class="hint">' + idx.length + '</span></div>' +
        '<div class="agrid">' + idx.map(function (i) { return apprCard(items[i], i); }).join('') + '</div></section>';
    });
    el.innerHTML = '<div class="h-row"><div><h1>Onaylar</h1><p class="sub">' + (items.length ? items.length + ' talep bekliyor' : 'Bekleyen talep yok') + '</p></div>' +
      '<div class="day"><button class="btn" id="aref">Yenile</button></div></div>' +
      (html || '<div class="box"><div class="empty" style="border:0">Bekleyen talep yok. 🎉</div></div>') +
      '<div class="keys"><span><span class="kbd">↑</span> <span class="kbd">↓</span> talep</span><span><span class="kbd">O</span> onayla</span><span><span class="kbd">X</span> reddet</span></div>';
    document.getElementById('aref').onclick = loadApprovals;
    Array.prototype.forEach.call(el.querySelectorAll('.appr2'), function (c) {
      var i = +c.getAttribute('data-ai');
      c.onclick = function (e) {
        state.apprSel = i;
        var t = e.target.closest('button');
        if (t && t.hasAttribute('data-ok')) return decide(items[i], true, t);
        if (t && t.hasAttribute('data-no')) return decide(items[i], false, t);
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'A') apprHighlight();
      };
    });
  }
  function apprHighlight() {
    Array.prototype.forEach.call(document.querySelectorAll('.appr2'), function (c) {
      var on = +c.getAttribute('data-ai') === state.apprSel;
      c.classList.toggle('sel', on);
      if (on) c.scrollIntoView({block: 'nearest'});
    });
  }

  // Not soran pencere (uygulamadaki gibi; onayda isteğe bağlı, retde
  // sorumluya gösterilir).
  function noteBox(title, placeholder, okLabel, danger) {
    return new Promise(function (resolve) {
      var ov = document.createElement('div');
      ov.className = 'ov';
      ov.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3>' +
        '<textarea id="nt" rows="3" placeholder="' + esc(placeholder) + '"></textarea>' +
        '<div class="acts"><span class="hint"><span class="kbd">Enter</span> ' + esc(okLabel) + ' · <span class="kbd">Esc</span> vazgeç</span>' +
        '<button class="btn" data-n>Vazgeç</button><button class="btn ' + (danger ? 'live' : 'primary') + '" data-y>' + esc(okLabel) + '</button></div></div>';
      document.body.appendChild(ov);
      state.dlg = ov;
      var ta = ov.querySelector('#nt');
      function done(v) { ov.remove(); state.dlg = null; resolve(v); }
      ov.querySelector('[data-n]').onclick = function () { done(null); };
      ov.querySelector('[data-y]').onclick = function () { done(ta.value.trim()); };
      ov.onclick = function (e) { if (e.target === ov) done(null); };
      ov.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); done(null); }
        else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); done(ta.value.trim()); }
      });
      ta.focus();
    });
  }

  // Depoda boşta dosya kalmasın (uygulamadaki gibi): reddedilen yeni
  // fotoğraf ya da onayla yerini yenisine bırakan eski talep fotoğrafı
  // silinir. Silinemezse karar yine geçerlidir.
  function dropUnusedPhoto(x, ok) {
    var ch = x.changes || {}, pr = x.previous || {};
    if (!('photo_url' in ch)) return null;
    var url = String((ok ? pr.photo_url : ch.photo_url) || '');
    var m = /\/object\/public\/media\/(.+)$/.exec(url);
    if (!m || url.indexOf('/media/profile_requests/') < 0) return null;
    return token().then(function (t) {
      return fetch(BASE + '/storage/v1/object/media', {
        method: 'DELETE',
        headers: {apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json'},
        body: JSON.stringify({prefixes: [decodeURIComponent(m[1].split('?')[0])]})
      });
    }).then(function () { return null; }, function () { return null; });
  }

  // Vazgeçilen karar (boş yanıt veren kayıtlardan ayırmak için).
  var CANCEL = {};
  function decide(it, ok, btn) {
    var x = it.x, p;
    if (it.kind === 'roster' || it.kind === 'profile') {
      p = noteBox(ok ? 'Talebi onayla' : 'Talebi reddet', ok ? 'Not (isteğe bağlı)' : 'Red nedeni (sorumluya gösterilir)', ok ? 'Onayla' : 'Reddet', !ok)
        .then(function (note) {
          if (note === null) return CANCEL;
          return it.kind === 'roster'
            ? api('rpc/review_pending_action', {method: 'POST', body: {p_action_id: x.id, p_approve: ok, p_note: note || null}})
            : api('rpc/review_profile_change', {method: 'POST', body: {p_id: x.id, p_approve: ok, p_note: note || null}})
                .then(function () { return dropUnusedPhoto(x, ok); });
        });
    } else if (it.kind === 'penalty') {
      var inp = document.querySelector('[data-cnt="' + state.apprSel + '"]');
      var n = inp ? parseInt(inp.value, 10) : x.match_count;
      if (ok && !(n >= 1)) { toast('Ceza en az 1 maç olmalı.', true); if (inp) inp.focus(); return; }
      p = confirmBox(ok ? 'Cezayı onayla' : 'Cezayı reddet', (x.player || '') + (ok ? ' · ' + n + ' maç ceza' : ' · ceza düşer'), ok ? 'Onayla' : 'Reddet', !ok)
        .then(function (yes) {
          if (!yes) return CANCEL;
          return api('rpc/review_player_penalty', {method: 'POST', body: {p_penalty_id: x.id, p_approve: ok, p_match_count: ok ? n : null}});
        });
    } else if (it.kind === 'conflict') {
      p = api('rpc/resolve_youtube_conflict', {method: 'POST', body: {p_id: x.id, p_use_auto: ok}});
    } else {
      // Alınmayan gönderi silinir; instagram_seen_media'da kaldığı için
      // tekrar aktarılmaz (uygulamadaki gibi).
      p = ok
        ? api('news?id=eq.' + x.id, {method: 'PATCH', body: {is_published: true}})
        : confirmBox('Haberlere alma', 'Gönderi Haberler\'e alınmayacak.', 'Alma', true).then(function (yes) {
            return yes ? api('news?id=eq.' + x.id, {method: 'DELETE'}) : CANCEL;
          });
    }
    if (btn) btn.disabled = true;
    p.then(function (r) {
      if (btn) btn.disabled = false;
      if (r === CANCEL) return;
      toast(ok ? 'Onaylandı.' : 'Karar kaydedildi.');
      return loadApprovals();
    }, function (e) {
      if (btn) btn.disabled = false;
      toast(e.message, true);
    });
  }

  function apprKey(e) {
    var items = apprItems();
    if (!items.length) return;
    var k = e.key.length === 1 ? e.key.toLocaleUpperCase('tr') : e.key;
    if (k === 'ArrowDown') { e.preventDefault(); state.apprSel = Math.min(items.length - 1, state.apprSel + 1); apprHighlight(); }
    else if (k === 'ArrowUp') { e.preventDefault(); state.apprSel = Math.max(0, state.apprSel - 1); apprHighlight(); }
    else if ((k === 'O' || k === 'X') && state.apprSel >= 0) {
      e.preventDefault();
      var b = document.querySelector('.appr2[data-ai="' + state.apprSel + '"] [data-' + (k === 'O' ? 'ok' : 'no') + ']');
      decide(items[state.apprSel], k === 'O', b);
    }
  }

  // ---------- Sezon bölümleri ----------
  // Fikstür, Puan Durumu, Takımlar, Lisanslar, Cezalar, Sponsorlar ve
  // Haberler aynı sezon verisini kullanır (desk_season, tek istek).
  var SEASON_VIEWS = {fixture: 1, standings: 1, teams: 1, licenses: 1, penalties: 1, sponsors: 1, news: 1};
  var STATUS_TR = {notStarted: 'Başlamadı', live: 'Canlı', halftime: 'Devre arası', finished: 'Bitti', postponed: 'Ertelendi', cancelled: 'İptal'};
  var POS_TR = {GK: 'Kaleci', DF: 'Defans', MF: 'Orta saha', FW: 'Forvet'};

  // Turnuva seçili değilse ilk turnuva kullanılır.
  function seasonLeague() {
    var ls = (state.data && state.data.leagues) || [];
    return state.league || (ls[0] && ls[0].id) || null;
  }
  function loadSeason(seasonId) {
    var lg = seasonLeague();
    if (!lg) return Promise.resolve();
    return api('rpc/desk_season', {method: 'POST', body: {p_league_id: lg, p_season_id: seasonId || null}}).then(function (j) {
      if (lg !== seasonLeague()) return;
      state.season = {league: lg, data: j};
      if (SEASON_VIEWS[state.view]) renderContent();
    }, function (e) { toast(e.message, true); });
  }
  function S() { return state.season && state.season.league === seasonLeague() ? state.season.data : null; }
  function teamById(id) {
    var d = S();
    return d ? d.teams.filter(function (t) { return t.id === id; })[0] : null;
  }
  function teamName(id) { var t = teamById(id); return t ? t.name : '–'; }
  function groupName(id) {
    var d = S(), g = d && d.groups.filter(function (x) { return x.id === id; })[0];
    return g ? g.name : '';
  }
  function seasonBar(title, right) {
    var d = S();
    var opts = d.seasons.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === d.season_id ? ' selected' : '') + '>' + esc(s.name) + (s.active ? '' : ' (pasif)') + '</option>';
    }).join('');
    var lg = currentLeague() || ((state.data && state.data.leagues) || []).filter(function (l) { return l.id === seasonLeague(); })[0];
    return '<div class="h-row"><div><h1>' + esc(title) + '</h1><p class="sub">' + esc(lg ? lg.name : '') +
      (!state.league && (state.data.leagues || []).length > 1 ? ' · başka turnuva için üst banttan seçin' : '') + '</p></div>' +
      '<div class="day">' + (right || '') + '<select id="ssel" class="sel">' + opts + '</select></div></div>';
  }
  function bindSeasonBar(el) {
    var s = el.querySelector('#ssel');
    if (s) s.onchange = function () { state.season = null; renderContent(); loadSeason(s.value); };
  }

  function renderSeasonView(el) {
    if (!state.data) { el.innerHTML = '<div class="box"><div class="empty" style="border:0">Yükleniyor…</div></div>'; return; }
    if (!seasonLeague()) { el.innerHTML = '<div class="box"><div class="empty" style="border:0">Yönettiğiniz turnuva yok.</div></div>'; return; }
    if (!S()) {
      el.innerHTML = '<div class="box"><div class="empty" style="border:0">Yükleniyor…</div></div>';
      loadSeason();
      return;
    }
    ({fixture: renderFixture, standings: renderStandings, teams: renderTeams, licenses: renderLicenses,
      penalties: renderPenalties, sponsors: renderSponsors, news: renderNews})[state.view](el);
    bindSeasonBar(el);
  }

  // ----- Fikstür: hafta hafta tablo; tarih, saat, saha ve durum yerinde
  // değişir (her değişiklik hemen kaydedilir).
  function renderFixture(el) {
    var d = S();
    var weeks = [];
    d.matches.forEach(function (m) { var w = m.week == null ? 0 : m.week; if (weeks.indexOf(w) < 0) weeks.push(w); });
    weeks.sort(function (a, b) { return a - b; });
    if (state.fxWeek == null || weeks.indexOf(state.fxWeek) < 0) {
      // Varsayılan: oynanmamış maçı olan ilk hafta.
      var open = d.matches.filter(function (m) { return m.status === 'notStarted' || m.status === 'live' || m.status === 'halftime'; })[0];
      state.fxWeek = open ? (open.week == null ? 0 : open.week) : weeks[weeks.length - 1];
    }
    var list = d.matches.filter(function (m) { return (m.week == null ? 0 : m.week) === state.fxWeek; });
    var multiGroup = d.groups.length > 1;
    var pitchOpts = function (sel) {
      return '<option value="">—</option>' + d.pitches.map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('');
    };
    var rowsHtml = list.map(function (m) {
      var editable = m.status === 'notStarted' || m.status === 'postponed' || m.status === 'cancelled';
      var played = m.status === 'finished' || m.status === 'live' || m.status === 'halftime';
      var st = editable
        ? '<select data-f="status" data-id="' + m.id + '">' + ['notStarted', 'postponed', 'cancelled'].map(function (s) {
            return '<option value="' + s + '"' + (s === m.status ? ' selected' : '') + '>' + STATUS_TR[s] + '</option>';
          }).join('') + '</select>'
        : '<span class="pill ' + (m.status === 'finished' ? 'ok' : 'live') + '">' + STATUS_TR[m.status] + '</span>';
      return '<tr>' +
        (multiGroup ? '<td class="mut">' + esc(groupName(m.group_id) || m.cup_round || '') + '</td>' : '') +
        '<td><input type="date" data-f="match_date" data-id="' + m.id + '" value="' + esc(m.date || '') + '"></td>' +
        '<td><input type="time" data-f="match_time" data-id="' + m.id + '" value="' + esc((m.time || '').slice(0, 5)) + '"></td>' +
        '<td><select data-f="pitch_id" data-id="' + m.id + '">' + pitchOpts(m.pitch_id) + '</select></td>' +
        '<td class="r b">' + esc(teamName(m.home_id)) + '</td>' +
        '<td class="c b num">' + (played ? m.hs + ' – ' + m.as : '–') + '</td>' +
        '<td class="b">' + esc(teamName(m.away_id)) + '</td>' +
        '<td>' + st + '</td>' +
        '<td><button class="btn ghost" data-open="' + m.id + '">Maç</button></td></tr>';
    }).join('');
    el.innerHTML = seasonBar('Fikstür') +
      '<div class="chips">' + weeks.map(function (w) {
        return '<button class="chip' + (w === state.fxWeek ? ' on' : '') + '" data-w="' + w + '">' + (w === 0 ? 'Haftasız' : w + '. hafta') + '</button>';
      }).join('') + '</div>' +
      '<section class="box"><div class="table-wrap"><table class="tbl"><thead><tr>' + (multiGroup ? '<th>Grup</th>' : '') +
      '<th>Tarih</th><th>Saat</th><th>Saha</th><th class="r">Ev sahibi</th><th class="c">Skor</th><th>Deplasman</th><th>Durum</th><th></th></tr></thead><tbody>' +
      (rowsHtml || '<tr><td colspan="9" class="empty">Bu haftada maç yok.</td></tr>') + '</tbody></table></div></section>' +
      '<p class="sub">Değişiklikler hemen kaydedilir. Skor ve olaylar için Bugün ekranında maçı açın.</p>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-w]'), function (b) {
      b.onclick = function () { state.fxWeek = +b.getAttribute('data-w'); renderContent(); };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-f]'), function (inp) {

  // ----- Puan Durumu (uygulamadaki hesapla aynı: puan, ikili averaj,
  // genel averaj, atılan gol, ad; eleme maçları sayılmaz).
  function standingsOf(groupId) {
    var d = S();
    var ms = d.matches.filter(function (m) { return !m.knockout && (groupId ? m.group_id === groupId : true); });
    var played = function (m) { return m.status === 'finished'; };
    var table = {};
    d.teams.forEach(function (t) {
      if (!groupId || t.group_id === groupId) table[t.id] = {id: t.id, name: t.name, logo: t.logo, o: 0, g: 0, b: 0, m: 0, a: 0, y: 0, p: 0, form: []};
    });
    ms.forEach(function (m) {
      if (!table[m.home_id] && groupId) return;
      [m.home_id, m.away_id].forEach(function (id) { if (!table[id]) { var t = teamById(id); table[id] = {id: id, name: t ? t.name : '–', logo: t && t.logo, o: 0, g: 0, b: 0, m: 0, a: 0, y: 0, p: 0, form: []}; } });
    });
    var done = ms.filter(played).sort(function (x, y) { return ((x.date || '') + (x.time || '')).localeCompare((y.date || '') + (y.time || '')); });
    done.forEach(function (m) {
      var h = table[m.home_id], a = table[m.away_id];
      if (!h || !a) return;
      var hs = m.hs || 0, as = m.as || 0;
      h.o++; a.o++; h.a += hs; h.y += as; a.a += as; a.y += hs;
      if (hs > as) { h.g++; h.p += 3; a.m++; h.form.push('G'); a.form.push('M'); }
      else if (as > hs) { a.g++; a.p += 3; h.m++; h.form.push('M'); a.form.push('G'); }
      else { h.b++; a.b++; h.p++; a.p++; h.form.push('B'); a.form.push('B'); }
    });
    function h2h(x, y) {
      var px = 0, py = 0, gx = 0, gy = 0;
      done.forEach(function (m) {
        var xh = m.home_id === x.id && m.away_id === y.id, yh = m.home_id === y.id && m.away_id === x.id;
        if (!xh && !yh) return;
        var xg = xh ? m.hs : m.as, yg = xh ? m.as : m.hs;
        gx += xg - yg; gy += yg - xg;
        if (xg > yg) px += 3; else if (yg > xg) py += 3; else { px++; py++; }
      });
      return [px, py, gx, gy];
    }
    return Object.keys(table).map(function (k) { return table[k]; }).sort(function (x, y) {
      if (y.p !== x.p) return y.p - x.p;
      var h = h2h(x, y);
      if (h[1] !== h[0]) return h[1] - h[0];
      if (h[3] !== h[2]) return h[3] - h[2];
      if ((y.a - y.y) !== (x.a - x.y)) return (y.a - y.y) - (x.a - x.y);
      if (y.a !== x.a) return y.a - x.a;
      return x.name.localeCompare(y.name, 'tr');
    });
  }

  // ----- Görsel yükleme (uygulamadaki gibi küçültülür): media/<klasör>/.
  function shrinkImage(file, maxSide, keepPng) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var png = keepPng && /png|webp|gif/.test(file.type);
        c.toBlob(function (b) { b ? resolve({blob: b, ext: png ? 'png' : 'jpg', aspect: img.width / img.height}) : reject(new Error('Görsel işlenemedi.')); },
          png ? 'image/png' : 'image/jpeg', .85);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = function () { reject(new Error('Görsel okunamadı.')); };
      img.src = URL.createObjectURL(file);
    });
  }
  function uploadImage(file, folder, maxSide, keepPng) {
    var info;
    return shrinkImage(file, maxSide, keepPng).then(function (r) {
      info = r;
      return token();
    }).then(function (t) {
      var path = folder + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + info.ext;
      return fetch(BASE + '/storage/v1/object/media/' + path, {
        method: 'POST',
        headers: {apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': info.ext === 'png' ? 'image/png' : 'image/jpeg', 'x-upsert': 'false'},
        body: info.blob
      }).then(function (r) {
        if (!r.ok) throw new Error('Görsel yüklenemedi (' + r.status + ').');
        return {url: BASE + '/storage/v1/object/public/media/' + path, aspect: info.aspect};
      });
    });
  }

      if (!text) { toast('Haber metnini yazın.', true); return; }
      btn.disabled = true;
      Promise.all(files.map(function (f) { return uploadImage(f, 'news', 1600, false); })).then(function (imgs) {
        // Kapak (image_url) veritabanında ilk fotoğraftan doldurulur.
        return api('news', {method: 'POST', prefer: 'return=minimal', body: {
          season_id: d.season_id, content: text, is_published: el.querySelector('#np').checked,
          image_urls: imgs.map(function (i) { return i.url; })
        }});
      }).then(function () {
        toast('Haber kaydedildi.');
        loadSeason(d.season_id);
      }, function (e) { btn.disabled = false; toast(e.message, true); });
    };
    function byId(id) { return d.news.filter(function (n) { return n.id === id; })[0]; }
    Array.prototype.forEach.call(el.querySelectorAll('[data-npub]'), function (b) {
      b.onclick = function () {
        var n = byId(b.getAttribute('data-npub'));
        api('news?id=eq.' + n.id, {method: 'PATCH', body: {is_published: !n.published}}).then(function () { toast('Kaydedildi.'); loadSeason(d.season_id); }, function (e) { toast(e.message, true); });
      };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ndel]'), function (b) {
      b.onclick = function () {
        var n = byId(b.getAttribute('data-ndel'));
        confirmBox('Haberi sil', 'Haber kalıcı olarak silinecek.', 'Sil', true).then(function (ok) {
          if (!ok) return;
          api('news?id=eq.' + n.id, {method: 'DELETE'}).then(function () { toast('Silindi.'); loadSeason(d.season_id); }, function (e) { toast(e.message, true); });
        });
      };
    });
  }

  // ---------- Ctrl+K arama ----------
  // Takım, oyuncu ve günün maçları; seçince ilgili ekran açılır.
  function openSearch() {
    if (state.dlg) return;
    if (!S()) loadSeason();
    var ov = document.createElement('div');
    ov.className = 'ov top-ov';
    ov.innerHTML = '<div class="dlg sbox"><input id="q" class="inp big" placeholder="Maç, takım, oyuncu ara" autocomplete="off"><div id="qr" class="qr"></div>' +
      '<div class="sub"><span class="kbd">↑</span> <span class="kbd">↓</span> seç · <span class="kbd">Enter</span> aç · <span class="kbd">Esc</span> kapat</div></div>';
    document.body.appendChild(ov);
    state.dlg = ov;
    var q = ov.querySelector('#q'), qr = ov.querySelector('#qr'), res = [], sel = 0;
    function close() { ov.remove(); state.dlg = null; }
    function search() {
      var t = q.value.trim().toLocaleLowerCase('tr');
      res = [];
      if (t) {
        var d = S();
        rows().forEach(function (m) {
          if ((m.home + ' ' + m.away).toLocaleLowerCase('tr').indexOf(t) >= 0) res.push({k: 'match', m: m, label: m.home + ' – ' + m.away, sub: 'Maç · ' + shortDate(m.date) + ' ' + (m.time || '').slice(0, 5)});
        });
        if (d) {
          d.teams.forEach(function (x) { if (x.name.toLocaleLowerCase('tr').indexOf(t) >= 0) res.push({k: 'team', id: x.id, label: x.name, sub: 'Takım'}); });
          d.players.forEach(function (p) { if (p.name.toLocaleLowerCase('tr').indexOf(t) >= 0) res.push({k: 'player', p: p, label: p.name, sub: 'Oyuncu · ' + teamName(p.team_id)}); });
        }
        res = res.slice(0, 12);
      }
      sel = 0;
      draw();
    }
    function draw() {
      qr.innerHTML = res.map(function (r, i) {
        return '<button class="qi' + (i === sel ? ' sel' : '') + '" data-q="' + i + '"><b>' + esc(r.label) + '</b><small>' + esc(r.sub) + '</small></button>';
      }).join('') || (q.value.trim() ? '<div class="empty" style="border:0">Sonuç yok.</div>' : '');
      Array.prototype.forEach.call(qr.querySelectorAll('[data-q]'), function (b) { b.onclick = function () { pick(res[+b.getAttribute('data-q')]); }; });
    }
    function pick(r) {
      if (!r) return;
      close();
      if (r.k === 'match') { go('today'); openLive(r.m.id); }
      else if (r.k === 'team') { state.teamSel = r.id; go('teams'); }
      else { state.lisQ = r.p.name; state.lisTeam = null; go('licenses'); }
    }
    q.oninput = search;
    ov.onclick = function (e) { if (e.target === ov) close(); };
    ov.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(res.length - 1, sel + 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
      else if (e.key === 'Enter') { e.preventDefault(); pick(res[sel]); }
    });
    q.focus();
  }

  // Oyuncu menüsü dışına tıklayınca kapanır.
  document.addEventListener('pointerdown', function (e) {
    if (!state.menu) return;
    var t = e.target;
    if (t.closest && (t.closest('#pmenu') || t.closest('[data-tk]'))) return;
    closeMenu();
  });

  // ---------- klavye ----------
  var arrowTimer = null;
  document.addEventListener('keydown', function (e) {
    if (session && (e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openSearch(); return; }
    if (!session || state.dlg || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (state.view === 'approvals') return apprKey(e);
    if (state.view !== 'today' && state.view !== 'live') return;
    if (liveKey(e)) return;
    var all = rows();
    // Oklarla gezerken sağdaki maç da kısa bir beklemeden sonra değişir.
    function moveSel(n) {
      state.sel = Math.max(0, Math.min(all.length - 1, state.sel + n));
      highlight();
      clearTimeout(arrowTimer);
      arrowTimer = setTimeout(function () { if (all[state.sel]) openLive(all[state.sel].id); }, 250);
    }
    if (e.key === 'ArrowLeft') { e.preventDefault(); setDate(addDays(state.date, -1)); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setDate(addDays(state.date, 1)); }
    else if (e.key === 'ArrowDown' && all.length) { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp' && all.length) { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter' && state.sel >= 0 && all[state.sel]) {
      e.preventDefault();
      var m = all[state.sel];
      if (m.overdue) {
        var inp = document.querySelector('.mrow[data-i="' + state.sel + '"] [data-h]');
        if (inp) inp.focus();
      } else openScore(m);
    }
    else if (e.key === 'b' || e.key === 'B') { setDate(today()); }
    else if ((e.key === 'r' || e.key === 'R') && !state.liveId) { load(); }
  });

  loadSession();
  readHash();
  render();
})();
</script>
</body>
</html>
